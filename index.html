    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // רכיב אייקון דינמי
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {

        const ICON_LIST = [

            'bar-chart-3', 'users', 'sparkles', 'bot', 'brain', 'workflow', 'route', 'warehouse',
            'contact', 'list-checks', 'globe', 'shield', 'zap', 'coins', 'credit-card', 'hammer',
            'clock', 'calendar', 'database', 'settings', 'check-circle-2', 'file-text', 'server',
            'wifi', 'box', 'copy', 'download', 'upload', 'lock', 'image', 'activity', 'puzzle', 'mail'

        // מפתחות אחסון בדפדפן
        const OFFICIAL_URL = 'pricing.json';               // המחירון הרשמי, ברירת המחדל לכולם

        // מזהה מיישם מהקישור האישי:  index.html?p=moshe  ->  pricing-moshe.json
        // מסונן לתווים בטוחים בלבד, כדי שלא ניתן יהיה להצביע דרכו על קובץ אחר.
        const readPartnerId = () => {
            try {
                const raw = new URLSearchParams(window.location.search).get('p') || '';
                return raw.toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 40);
            } catch { return ''; }
        };
        const PARTNER_ID    = readPartnerId();
        const PRICEBOOK_URL = PARTNER_ID ? 'pricing-' + PARTNER_ID + '.json' : OFFICIAL_URL;

        // העקיפה המקומית נשמרת בנפרד לכל מחירון, כדי ששינוי בקישור אחד לא ידלוף לאחר

        // השוואת מחירונים תוך התעלמות משדות שאינם חלק מהתמחור
        const pricingFingerprint = (c) => {

            return JSON.stringify(rest);
        };
        const BRAND_KEY   = 'oneflow_implementer_brand_v1'; // מיתוג המיישם (לוגו + שם) - נשמר בנפרד

        // --- נתוני ברירת מחדל: מודל טרנזקציות ---

        // בייסיק:  8,000 טרנזקציות x 0.05 = 400 ש"ח
        // פרימיום: 12,000 טרנזקציות x 0.05 = 600 ש"ח

                { id: 'marketing', name: 'שיווק ודיוור',   icon: 'megaphone',   tier: 'basic',   price: 400, includedTx: 8000,  setupHours: 24, note: 'ניהול פעולות שיווק ודיוור מול גורמי פנים וחוץ' },
                { id: 'bi',        name: 'דוחות ו-BI',     icon: 'bar-chart-3', tier: 'basic',   price: 400, includedTx: 8000,  setupHours: 45, note: 'ממשקי מידע, דשבורדים ודוחות מותאמים לתפקיד ולצורך, בחתכי פעילות וזמן' },
                { id: 'crm',       name: 'CRM',            icon: 'users',       tier: 'premium', price: 600, includedTx: 12000, setupHours: 60, note: 'ניהול תהליכים עסקיים' },
                { id: 'ai',        name: 'AI Assistant',   icon: 'sparkles',    tier: 'premium', price: 600, includedTx: 12000, setupHours: 40, note: 'עוזר חכם, חיזוי והמלצות בזמן אמת' },
                { id: 'erp',       name: 'אינטגרציה למערכות ERP', icon: 'server', tier: 'basic',   price: 400, includedTx: 8000,  setupHours: 60, note: 'ממשק דו-כיווני מול מערכת ה-ERP הארגונית: סנכרון פריטים, לקוחות, מסמכים ותנועות' },
                { id: 'external',  name: 'אינטגרציה למקור חיצוני', icon: 'globe', tier: 'basic',   price: 400, includedTx: 8000,  setupHours: 40, note: 'אתרים, מרכזי כוכב, נותני שירות, קופות וכו' },
            ],

            // חבילת טרנזקציות נוספת - יחידת הבסיס לסולם התחנות
            extraTxPack: { tx: 2500, price: 125 },
            // תחנות מהירות: כמה חבילות בכל תחנה

            // משתמשים
            users: { included: 15, packSize: 5, packPrice: 500 },

            customSections: []
        };

        // --- עזרי פורמט ---
        const fmt   = (n) => Math.round(Number(n) || 0).toLocaleString('he-IL');
        const money = (n) => fmt(n) + ' ₪';
        const usd   = (n, rate) => '≈ $' + fmt((Number(n) || 0) / (Number(rate) || 3.7));

        // הקטנת תמונה לפני שמירה בדפדפן (כדי לא לחרוג ממגבלת האחסון)
        const resizeImage = (file, maxWidth, callback) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, maxWidth / img.width);
                    const w = Math.round(img.width * scale);
                    const h = Math.round(img.height * scale);
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/png'));
                };
                img.onerror = () => callback(null);
                img.src = e.target.result;
            };
            reader.onerror = () => callback(null);
            reader.readAsDataURL(file);
        };

        // מיגרציה: התאמת קובץ הגדרות ישן למבנה החדש
        const migrateConfig = (raw) => {
            const c = { ...DEFAULT_CONFIG, ...raw };
            // מיזוג לעומק לכל רמה, כדי ששדה חדש (כמו includedMonthlyTx) יקבל ברירת מחדל
            // גם במחירונים ישנים שנשמרו לפני שהוא נוסף
            c.moduleTiers = {
                basic:   { ...DEFAULT_CONFIG.moduleTiers.basic,   ...((raw.moduleTiers || {}).basic || {}) },
                premium: { ...DEFAULT_CONFIG.moduleTiers.premium, ...((raw.moduleTiers || {}).premium || {}) }
            };
            c.uiText      = { ...DEFAULT_CONFIG.uiText,      ...(raw.uiText || {}) };
            c.extraTxPack = { ...DEFAULT_CONFIG.extraTxPack, ...(raw.extraTxPack || {}) };
            c.proposalDefaults = { ...DEFAULT_CONFIG.proposalDefaults, ...(raw.proposalDefaults || {}) };
            c.users       = { ...DEFAULT_CONFIG.users,       ...(raw.users || {}) };
            if (!Array.isArray(c.txStations) || !c.txStations.length) c.txStations = DEFAULT_CONFIG.txStations;
            c.minModules = Number(raw.minModules !== undefined ? raw.minModules : DEFAULT_CONFIG.minModules) || 0;
            c.minMonthlyCharge = Number(raw.minMonthlyCharge !== undefined ? raw.minMonthlyCharge : DEFAULT_CONFIG.minMonthlyCharge) || 0;
            if (!Array.isArray(c.customSections)) c.customSections = [];

            c.modules = (Array.isArray(raw.modules) ? raw.modules : DEFAULT_CONFIG.modules).map(m => {
                const tier = (m.tier === 'premium') ? 'premium' : 'basic';
                const tierDef = c.moduleTiers[tier];
                return {
                    id: m.id || ('mod_' + Math.random().toString(36).slice(2)),
                    name: m.name || 'מודול',
                    icon: m.icon || 'package',
                    tier,
                    // גרסה ישנה עבדה בימי הקמה - ממירים לשעות
                    setupHours: Number(
                        m.setupHours !== undefined
                            ? m.setupHours
                            : (Number(m.setupDays || 0) * Number(raw.setupHoursPerDay || DEFAULT_CONFIG.setupHoursPerDay))
                    ) || 0,
                    price: Number(m.price !== undefined ? m.price : tierDef.price) || 0,
                    includedTx: Number(m.includedTx !== undefined ? m.includedTx : tierDef.tx) || 0,
                    // טרנזקציות הכלולות בעלות החודשית (מתחדשות), בנפרד ממענק ההקמה החד-פעמי
                    includedMonthlyTx: Number(m.includedMonthlyTx !== undefined ? m.includedMonthlyTx : tierDef.includedMonthlyTx) || 0,
                    note: m.note || ''
                };
            });

            // הזרמת מודולים שנוספו לקטלוג אל מחירונים שנשמרו בגרסה קודמת.
            // מתבצע פעם אחת בלבד לכל גרסת קטלוג, כדי לא לשחזר מודולים שנמחקו ביודעין.
            const savedVersion = Number(raw.catalogVersion) || 0;
            if (savedVersion < CATALOG_VERSION) {
                const existing = new Set(c.modules.map(m => m.id));
                for (let v = savedVersion + 1; v <= CATALOG_VERSION; v++) {
                    (CATALOG_ADDITIONS[v] || []).forEach(id => {
                        if (existing.has(id)) return;
                        const dm = DEFAULT_CONFIG.modules.find(m => m.id === id);
                        if (dm) { c.modules.push(JSON.parse(JSON.stringify(dm))); existing.add(id); }
                    });
                }
            }
            c.catalogVersion = CATALOG_VERSION;

            // ניקוי שדות שאינם בשימוש במודל החדש
            delete c.publicUserPackages;
            delete c.privateUserPackages;
            delete c.globalTiers;
            delete c.aiPackages;
            delete c.enableAI;
            delete c.enableGlobalTiers;
            delete c.enableTiers;
            delete c.enableUsers;
            delete c.tiers;
            return c;
        };


        // ============================================================

        // ============================================================

                sections: [

                    { title: 'אתר ממותג בדפדפן', items: [

                        'מותאם למחשב, טאבלט ונייד' ] },
                    { title: 'קטלוג והזמנה', items: [

                    { title: 'עגלה ותשלום', items: [

                    { title: 'האזור האישי של הלקוח', items: [

        const BACKEND_KEY = 'oneflow_backend_v1';
        const LOCAL_DB_KEY = 'oneflow_pricebooks_v1';

        const DEFAULT_ORG_SLUG = 'onebtn_team';

        // ברירת המחדל מגיעה עם האתר (שדה backend ב-pricing.json), כדי שכל מיישם
        // יתחבר לשרת אוטומטית. עקיפה מקומית, אם קיימת, גוברת עליה.
        let SHIPPED_BACKEND = { baseUrl: '', orgSlug: DEFAULT_ORG_SLUG, extraHeaders: '' };
        const setShippedBackend = (b) => {
            if (!b || typeof b !== 'object') return;
            SHIPPED_BACKEND = {
                baseUrl: (b.baseUrl || '').replace(/\/+$/, ''),
                orgSlug: b.orgSlug !== undefined ? b.orgSlug : DEFAULT_ORG_SLUG,
                extraHeaders: b.extraHeaders || ''
            };
        };

        const readLocalBackendOverride = () => {
            try { return JSON.parse(localStorage.getItem(BACKEND_KEY) || 'null'); }
            catch { return null; }
        };

        const readBackendConfig = () => {
            const o = readLocalBackendOverride() || {};
            const pick = (k, d) => (o[k] !== undefined && o[k] !== '') ? o[k] : d;
            return {
                baseUrl: String(pick('baseUrl', SHIPPED_BACKEND.baseUrl)).replace(/\/+$/, ''),
                token: o.token || '',
                orgSlug: pick('orgSlug', SHIPPED_BACKEND.orgSlug),
                extraHeaders: pick('extraHeaders', SHIPPED_BACKEND.extraHeaders)
            };
        };

        // כותרות נוספות, שורה לכל אחת בתבנית  שם: ערך
        const parseExtraHeaders = (text) => {
            const out = {};
            (text || '').split(/\r?\n/).forEach(line => {
                const i = line.indexOf(':');
                if (i < 1) return;
                const k = line.slice(0, i).trim();
                const v = line.slice(i + 1).trim();
                if (k && v) out[k] = v;
            });
            return out;
        };

        // כל הכותרות הנשלחות בבקשה לשרת
        const buildHeaders = (cfg, extra) => ({
            'Content-Type': 'application/json',
            ...(cfg.token ? { 'Authorization': 'Bearer ' + cfg.token } : {}),
            ...(cfg.orgSlug ? { 'x-org-slug': cfg.orgSlug } : {}),
            ...parseExtraHeaders(cfg.extraHeaders),
            ...(extra || {})
        });
        const writeBackendConfig = (c) => {
            try { localStorage.setItem(BACKEND_KEY, JSON.stringify(c)); } catch {}
        };

        // אסימון כניסה של המיישם, מונפק אחרי אימות סיסמה מול השרת.
        // נשמר בנפרד לכל קישור אישי, כדי שכניסה תחת מחירון אחד לא תעניק גישה לאחר.
        const SESSION_SCOPE = PARTNER_ID || '__master__';
        const readSessionToken = () => {
            try { return localStorage.getItem('oneflow_session::' + SESSION_SCOPE) || ''; } catch { return ''; }
        };
        const writeSessionToken = (token) => {
            try {
                if (token) localStorage.setItem('oneflow_session::' + SESSION_SCOPE, token);
                else localStorage.removeItem('oneflow_session::' + SESSION_SCOPE);
            } catch {}
        };

        // אסימון כניסת מנהל בסיסמה - כללי, לא תלוי בקישור אישי. פעם אחת
        // בדפדפן הזה, ואז אין צורך יותר להעתיק את מפתח הגישה הגולמי.
        const ADMIN_SESSION_KEY = 'oneflow_admin_session';
        const readAdminSessionToken = () => {
            try { return localStorage.getItem(ADMIN_SESSION_KEY) || ''; } catch { return ''; }
        };
        const writeAdminSessionToken = (token) => {
            try {
                if (token) localStorage.setItem(ADMIN_SESSION_KEY, token);
                else localStorage.removeItem(ADMIN_SESSION_KEY);
            } catch {}
        };

        const nowIso = () => new Date().toISOString();
        const newId = (p) => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

        // --- הצפנת סיסמאות (Web Crypto) ---
        const randomSalt = () => {
            const a = new Uint8Array(16);
            (window.crypto || {}).getRandomValues?.(a);
            return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
        };
        const sha256Hex = async (text) => {
            const subtle = window.crypto && window.crypto.subtle;
            if (!subtle) throw new Error('crypto unavailable');
            const buf = await subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        };
        const hashPassword = async (password, salt) => sha256Hex(salt + '|' + password);
        const cryptoAvailable = () => !!(window.crypto && window.crypto.subtle);

        // ============================================================
        //  פרופיל מיישם והצעות מחיר - קבועים משותפים
        // ============================================================
        const PROFILE_FIELDS = ['businessName', 'businessId', 'contactName', 'phone', 'email', 'address'];
        const PROFILE_LABELS = {
            businessName: 'שם המיישם / העסק', businessId: 'ח.פ / ע.מ',
            contactName: 'שם איש קשר מלא', phone: 'טלפון', email: 'מייל', address: 'כתובת'
        };
        const PROFILE_EMPTY = { businessName: null, businessId: null, contactName: null, phone: null, email: null, address: null, completedAt: null };
        const isProfileComplete = (p) => !!p && PROFILE_FIELDS.every(k => String(p[k] || '').trim());

        const CLIENT_FIELDS = ['clientName', 'clientBusinessId', 'clientContactName', 'clientPhone', 'clientEmail', 'clientAddress'];
        const CLIENT_LABELS = {
            clientName: 'שם הלקוח', clientBusinessId: 'ח.פ / ע.מ', clientContactName: 'שם איש קשר מלא',
            clientPhone: 'טלפון', clientEmail: 'מייל', clientAddress: 'כתובת'
        };
        const isClientDetailComplete = (p) => !!p && CLIENT_FIELDS.every(k => String(p[k] || '').trim());

        const PROPOSAL_STATUSES = ['open', 'approved', 'won', 'lost', 'expired'];
        const PROPOSAL_STATUS_LABELS = {
            open: 'פתוחה', approved: 'אושרה', won: 'אושרה על ידי הלקוח', lost: 'נדחתה', expired: 'פגה תוקף'
        };
        const PROPOSAL_STATUS_CLASSES = {
            open: 'bg-blue-100 text-blue-700', approved: 'bg-indigo-100 text-indigo-700',
            won: 'bg-emerald-100 text-emerald-700', lost: 'bg-red-100 text-red-700', expired: 'bg-slate-200 text-slate-500'
        };
        const DEFAULT_RETENTION_DAYS = 14;
        // הפרש בימי לוח (לא ב-24 שעות מדויקות), כדי שהמונה ירד עם תחילת יום חדש
        // ולא ימתין ליום שלם מהשעה המדויקת שבה נוצרה ההצעה
        const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
        const retentionDaysLeft = (iso) => Math.round((startOfDay(new Date(iso)) - startOfDay(new Date())) / 86400000);

        // סה"כ הצעות פתוחות/מאושרות למיישם, לצורך KPI ברשימת המיישמים (מצב מקומי)
        const proposalKpi = (db, pricebookId) => {
            const list = Object.values((db.proposals || {})[pricebookId] || {});
            const open = list.filter(p => p.status === 'open' || p.status === 'approved');
            return {
                openProposalCount: open.length,
                openProposalSum: open.reduce((s, p) => s + (Number(p.totals && p.totals.totalMRR) || 0), 0)
            };
        };

        // --- מתאם מקומי: דפדפן בלבד ---
        const LocalAdapter = {
            name: 'local',
            isConnected: false,
            _read() {
                try {
                    const d = JSON.parse(localStorage.getItem(LOCAL_DB_KEY) || '{}');
                    return {
                        books: d.books || {}, versions: d.versions || {}, quotes: d.quotes || {}, proposals: d.proposals || {},
                        leadContactRequests: d.leadContactRequests || {}
                    };
                } catch { return { books: {}, versions: {}, quotes: {}, proposals: {}, leadContactRequests: {} }; }
            },
            _write(db) {
                try { localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(db)); return true; }
                catch { return false; }
            },
            async list() {
                const db = this._read();
                return Object.values(db.books).map(b => ({
                    id: b.id, label: b.label, kind: b.kind, implementerName: b.implementerName,
                    updatedAt: b.updatedAt, version: b.version, hasPassword: !!(b.auth && b.auth.hash),
                    disabled: !!b.disabled, lastLoginAt: b.lastLoginAt || null,
                    passwordChangedAt: b.passwordChangedAt || null,
                    quoteCount: Object.keys(db.quotes[b.id] || {}).length,
                    profile: b.profile || PROFILE_EMPTY,
                    profileCompleted: !!b.profileCompleted,
                    ...proposalKpi(db, b.id)
                }));
            },
            async get(id) { return this._read().books[id] || null; },
            async setDisabled(id, disabled) {
                const db = this._read();
                if (db.books[id]) { db.books[id].disabled = !!disabled; this._write(db); }
                return db.books[id] || null;
            },
            async put(doc) {
                const db = this._read();
                db.books[doc.id] = doc;
                if (!this._write(db)) throw new Error('storage full');
                return doc;
            },
            async remove(id) {
                const db = this._read();
                delete db.books[id];
                delete db.versions[id];
                this._write(db);
            },
            async listVersions(id) {
                const db = this._read();
                return (db.versions[id] || []).map(v => ({ id: v.id, at: v.at, note: v.note, version: v.version }));
            },
            async getVersion(id, vid) {
                const db = this._read();
                return (db.versions[id] || []).find(v => v.id === vid) || null;
            },
            async putVersion(id, entry) {
                const db = this._read();
                const list = db.versions[id] || [];
                list.unshift(entry);
                db.versions[id] = list.slice(0, 40); // שומרים היסטוריה סבירה בלבד
                this._write(db);
                return entry;
            },
            async verifyPassword(id, password) {
                const book = await this.get(id);
                if (!book) return false;
                const ok = !book.auth || !book.auth.hash
                    ? true
                    : await (async () => { try { return (await hashPassword(password, book.auth.salt)) === book.auth.hash; } catch { return false; } })();
                if (ok) { book.lastLoginAt = nowIso(); await this.put(book); }
                return ok;
            },
            async summary(id) {
                const b = await this.get(id);
                return b && { id: b.id, label: b.label, kind: b.kind, disabled: !!b.disabled, hasPassword: !!(b.auth && b.auth.hash) };
            },
            async listQuotes(pricebookId) {
                const db = this._read();
                return Object.values(db.quotes[pricebookId] || {}).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
            },
            async getQuote(pricebookId, id) {
                const db = this._read();
                return (db.quotes[pricebookId] || {})[id] || null;
            },
            async putQuote(pricebookId, doc) {
                const db = this._read();
                db.quotes[pricebookId] = db.quotes[pricebookId] || {};
                db.quotes[pricebookId][doc.id] = doc;
                this._write(db);
                return doc;
            },
            async removeQuote(pricebookId, id) {
                const db = this._read();
                if (db.quotes[pricebookId]) delete db.quotes[pricebookId][id];
                this._write(db);
            },
            async listLeads() {
                const db = this._read();
                const all = [];
                Object.entries(db.quotes).forEach(([pricebookId, qs]) => {
                    const book = db.books[pricebookId];
                    Object.values(qs).forEach(q => all.push({ ...q, pricebookLabel: book ? book.label : pricebookId }));
                });
                const proposalByQuoteId = {};
                Object.values(db.proposals || {}).forEach(byId => {
                    Object.values(byId).forEach(p => {
                        if (!p.sourceQuoteId) return;
                        const cur = proposalByQuoteId[p.sourceQuoteId];
                        if (!cur || (p.createdAt || '') > (cur.createdAt || '')) proposalByQuoteId[p.sourceQuoteId] = p;
                    });
                });
                const norm = (s) => (s || '').trim().toLowerCase();
                const byClient = {};
                all.forEach(q => { const k = norm(q.clientName); (byClient[k] = byClient[k] || []).push(q); });
                return all.map(q => {
                    const group = byClient[norm(q.clientName)];
                    const first = group.reduce((a, b) => (a.createdAt < b.createdAt ? a : b));
                    const implementerCount = new Set(group.map(g => g.pricebookId)).size;
                    const linkedProposal = proposalByQuoteId[q.id];
                    return {
                        ...q, contested: implementerCount > 1,
                        clientQuoteCount: group.length, clientImplementerCount: implementerCount,
                        clientFirstAt: first.createdAt, isFirstForClient: q.id === first.id,
                        proposal: linkedProposal ? { id: linkedProposal.id, status: linkedProposal.status, retentionExpiresAt: linkedProposal.retentionExpiresAt } : null
                    };
                }).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
            },
            // --- פרופיל מיישם (חובה) ---
            async getProfile(id) {
                const b = await this.get(id);
                return (b && b.profile) || null;
            },
            async putProfile(id, profile) {
                const db = this._read();
                const book = db.books[id];
                if (!book) return null;
                const merged = { ...(book.profile || PROFILE_EMPTY), ...profile };
                const completed = isProfileComplete(merged);
                if (completed && !merged.completedAt) merged.completedAt = nowIso();
                book.profile = merged;
                book.profileCompleted = completed;
                book.updatedAt = nowIso();
                this._write(db);
                return book;
            },
            // --- הצעות מחיר ---
            _decorateProposal(db, pricebookId, p) {
                const book = db.books[pricebookId];
                // האומדן שממנו ההצעה הומרה - מחפשים בכל המחירונים, כי אחרי שיוך מחדש של
                // ההצעה למיישם אחר האומדן המקורי עדיין שייך למיישם שיצר אותו
                let sourceQuote = null;
                if (p.sourceQuoteId) {
                    for (const pbId of Object.keys(db.quotes)) {
                        const q = (db.quotes[pbId] || {})[p.sourceQuoteId];
                        if (q) { sourceQuote = { id: q.id, clientName: q.clientName, note: q.note, totals: q.totals, createdAt: q.createdAt, updatedAt: q.updatedAt }; break; }
                    }
                }
                return { ...p, pricebookLabel: book ? book.label : pricebookId, implementerName: book ? book.implementerName : '', sourceQuote };
            },
            async listProposals(pricebookId) {
                const db = this._read();
                if (pricebookId) {
                    return Object.values(db.proposals[pricebookId] || {})
                        .map(p => this._decorateProposal(db, pricebookId, p))
                        .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
                }
                const all = [];
                Object.entries(db.proposals).forEach(([pbId, ps]) => {
                    Object.values(ps).forEach(p => all.push(this._decorateProposal(db, pbId, p)));
                });
                return all.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
            },
            async getProposal(id) {
                const db = this._read();
                for (const pbId of Object.keys(db.proposals)) {
                    if (db.proposals[pbId][id]) return this._decorateProposal(db, pbId, db.proposals[pbId][id]);
                }
                return null;
            },
            // מוצא הצעה פעילה (לא אבודה/פגה) של מיישם אחר לאותו שם לקוח, בתוך חלון השמירה
            _findLeadConflict(db, clientName, excludePricebookId, excludeId) {
                const norm = (s) => (s || '').trim().toLowerCase();
                const conflicts = [];
                Object.entries(db.proposals).forEach(([pbId, ps]) => {
                    if (pbId === excludePricebookId) return;
                    Object.values(ps).forEach(p => {
                        if (p.id === excludeId) return;
                        if (['lost', 'expired'].includes(p.status)) return;
                        if (new Date(p.retentionExpiresAt).getTime() <= Date.now()) return;
                        if (norm(p.clientName) === norm(clientName)) conflicts.push(this._decorateProposal(db, pbId, p));
                    });
                });
                conflicts.sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
                return conflicts[0] || null;
            },
            async putProposal(doc) {
                const db = this._read();
                const pricebookId = doc.pricebookId;
                db.proposals[pricebookId] = db.proposals[pricebookId] || {};
                const existing = db.proposals[pricebookId][doc.id];
                const isNew = !existing;
                // מיישם (לא מנהל) אינו יכול לייצר הצעת מחיר ללקוח שיש עליו הגנה אצל מיישם אחר - חוסם לפני השמירה
                if (doc.createdBy !== 'admin') {
                    const blocking = this._findLeadConflict(db, doc.clientName, pricebookId, doc.id);
                    if (blocking) {
                        const err = new Error('קיימת הגנה על ליד זה');
                        err.status = 409;
                        err.body = { error: 'lead_protected', retentionExpiresAt: blocking.retentionExpiresAt };
                        throw err;
                    }
                }
                const now = nowIso();
                const retentionDays = Number(doc.retentionDays) > 0 ? Number(doc.retentionDays) : (existing ? existing.retentionDays : DEFAULT_RETENTION_DAYS);
                const saved = {
                    ...doc, status: PROPOSAL_STATUSES.includes(doc.status) ? doc.status : 'open',
                    retentionDays,
                    retentionExpiresAt: existing ? existing.retentionExpiresAt : new Date(Date.now() + retentionDays * 86400000).toISOString(),
                    createdBy: (existing && existing.createdBy) || doc.createdBy || 'implementer',
                    createdAt: existing ? existing.createdAt : now,
                    updatedAt: now
                };
                db.proposals[pricebookId][doc.id] = saved;
                this._write(db);
                const out = this._decorateProposal(db, pricebookId, saved);
                // אזהרה מידעית בלבד למנהל (שאינו חסום) כשהוא שומר הצעה חדשה ללקוח שכבר מוגן במקום אחר
                if (isNew && doc.createdBy === 'admin') {
                    const conflict = this._findLeadConflict(db, doc.clientName, pricebookId, doc.id);
                    if (conflict) out.leadWarning = conflict;
                }
                return out;
            },
            async createLeadContactRequest(payload) {
                const db = this._read();
                db.leadContactRequests = db.leadContactRequests || {};
                const id = newId('lcr');
                const conflict = this._findLeadConflict(db, payload.clientName, payload.pricebookId, null);
                const book = db.books[payload.pricebookId];
                const rec = {
                    id, pricebookId: payload.pricebookId,
                    pricebookLabel: book ? book.label : payload.pricebookId,
                    implementerName: (book && book.implementerName) || payload.implementerName || null,
                    contactName: payload.contactName || null, contactPhone: payload.contactPhone || null, contactEmail: payload.contactEmail || null,
                    clientName: payload.clientName, clientBusinessId: payload.clientBusinessId || null,
                    clientContactName: payload.clientContactName || null, clientPhone: payload.clientPhone || null,
                    clientEmail: payload.clientEmail || null, clientAddress: payload.clientAddress || null,
                    message: payload.message || null,
                    protectingPricebookId: conflict ? conflict.pricebookId : null,
                    protectingPricebookLabel: conflict ? conflict.pricebookLabel : null,
                    protectingRetentionExpiresAt: conflict ? conflict.retentionExpiresAt : null,
                    status: 'open', createdAt: nowIso(), handledAt: null
                };
                db.leadContactRequests[id] = rec;
                this._write(db);
                return rec;
            },
            async listLeadContactRequests() {
                const db = this._read();
                return Object.values(db.leadContactRequests || {}).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
            },
            async setLeadContactRequestStatus(id, status) {
                const db = this._read();
                const rec = (db.leadContactRequests || {})[id];
                if (!rec) return null;
                rec.status = status;
                rec.handledAt = status === 'handled' ? nowIso() : null;
                this._write(db);
                return rec;
            },
            async removeProposal(id) {
                const db = this._read();
                Object.keys(db.proposals).forEach(pbId => { delete db.proposals[pbId][id]; });
                this._write(db);
            },
            async reassignProposal(id, pricebookId) {
                const db = this._read();
                let found = null, fromId = null;
                Object.entries(db.proposals).forEach(([pbId, ps]) => { if (ps[id]) { found = ps[id]; fromId = pbId; } });
                if (!found) return null;
                delete db.proposals[fromId][id];
                db.proposals[pricebookId] = db.proposals[pricebookId] || {};
                found.pricebookId = pricebookId;
                found.updatedAt = nowIso();
                db.proposals[pricebookId][id] = found;
                this._write(db);
                return this._decorateProposal(db, pricebookId, found);
            },
            async extendRetention(id, days) {
                const db = this._read();
                let found = null, pbKey = null;
                Object.entries(db.proposals).forEach(([pbId, ps]) => { if (ps[id]) { found = ps[id]; pbKey = pbId; } });
                if (!found) return null;
                const base = Math.max(new Date(found.retentionExpiresAt).getTime(), Date.now());
                found.retentionExpiresAt = new Date(base + Number(days) * 86400000).toISOString();
                found.updatedAt = nowIso();
                db.proposals[pbKey][id] = found;
                this._write(db);
                return this._decorateProposal(db, pbKey, found);
            },
            // --- כניסת מנהל בסיסמה - רלוונטי רק כשיש שרת. במצב מקומי אין מה לאבטח ---
            async adminStatus() { return { hasPassword: false }; },
            async adminLogin() { return { ok: false, error: 'no_password_set' }; },
            async adminSetPassword() { return { ok: false, error: 'forbidden' }; }
        };

        // --- מתאם שרת: מופעל ברגע שמוגדרת כתובת ---
        const ApiAdapter = (cfg) => ({
            name: 'api',
            isConnected: true,
            baseUrl: cfg.baseUrl,
            async _call(path, options = {}) {
                // סדר עדיפות: מפתח גישה גולמי שהוזן ידנית (גיבוי/איפוס) > כניסת מנהל
                // בסיסמה שנשמרה בדפדפן הזה > אסימון הכניסה של המיישם/מחירון, אם קיים
                const effectiveCfg = { ...cfg, token: cfg.token || readAdminSessionToken() || readSessionToken() };
                const res = await fetch(this.baseUrl + path, {
                    ...options,
                    headers: buildHeaders(effectiveCfg, options.headers)
                });
                if (res.status === 404) return null;
                if (!res.ok) {
                    const err = new Error('שגיאת שרת ' + res.status);
                    err.status = res.status;
                    // שומרים גם את גוף התגובה (למשל error:'lead_protected') כדי שקריאה ספציפית
                    // תוכל להבחין בין סוגי שגיאה שונים, בלי לשנות את טקסט השגיאה הכללי הקיים
                    err.body = await res.json().catch(() => null);
                    throw err;
                }
                return res.status === 204 ? null : res.json();
            },
            async list() { return (await this._call('/pricebooks')) || []; },
            async get(id) { return this._call('/pricebooks/' + encodeURIComponent(id)); },
            async summary(id) { return this._call('/pricebooks/' + encodeURIComponent(id) + '/summary'); },
            async put(doc) {
                return this._call('/pricebooks/' + encodeURIComponent(doc.id), {
                    method: 'PUT', body: JSON.stringify(doc)
                });
            },
            async remove(id) {
                return this._call('/pricebooks/' + encodeURIComponent(id), { method: 'DELETE' });
            },
            async setDisabled(id, disabled) {
                return this._call('/pricebooks/' + encodeURIComponent(id) + '/disabled', {
                    method: 'PUT', body: JSON.stringify({ disabled })
                });
            },
            async listVersions(id) {
                return (await this._call('/pricebooks/' + encodeURIComponent(id) + '/versions')) || [];
            },
            async getVersion(id, vid) {
                return this._call('/pricebooks/' + encodeURIComponent(id) + '/versions/' + encodeURIComponent(vid));
            },
            async putVersion(id, entry) {
                return this._call('/pricebooks/' + encodeURIComponent(id) + '/versions', {
                    method: 'POST', body: JSON.stringify(entry)
                });
            },
            // אימות הסיסמה נעשה בשרת, כך שההצפנה אינה נחשפת בדפדפן.
            // בהצלחה השרת מנפיק אסימון כניסה, גם כשלא הוגדרה סיסמה למחירון.
            async verifyPassword(id, password) {
                let r;
                try {
                    r = await this._call('/pricebooks/' + encodeURIComponent(id) + '/auth', {
                        method: 'POST', body: JSON.stringify({ password })
                    });
                } catch (e) {
                    // סיסמה שגויה מוחזרת כ-401: כישלון רגיל, לא שגיאת שרת
                    if (e && e.status === 401) return false;
                    if (e && e.status === 403) throw new Error('המשתמש הושבת. פנה למי שנתן לך את הקישור.');
                    throw e;
                }
                if (r && r.ok && r.token) writeSessionToken(r.token);
                return !!(r && r.ok);
            },
            async listQuotes(pricebookId) {
                return (await this._call('/quotes?pricebookId=' + encodeURIComponent(pricebookId))) || [];
            },
            async getQuote(pricebookId, id) { return this._call('/quotes/' + encodeURIComponent(id)); },
            async putQuote(pricebookId, doc) {
                return this._call('/quotes/' + encodeURIComponent(doc.id), {
                    method: 'PUT', body: JSON.stringify({ ...doc, pricebookId })
                });
            },
            async removeQuote(pricebookId, id) {
                return this._call('/quotes/' + encodeURIComponent(id), { method: 'DELETE' });
            },
            async listLeads() { return (await this._call('/leads')) || []; },
            // --- פרופיל מיישם (חובה) ---
            async getProfile(id) {
                const b = await this.get(id);
                return (b && b.profile) || null;
            },
            async putProfile(id, profile) {
                return this._call('/pricebooks/' + encodeURIComponent(id) + '/profile', {
                    method: 'PUT', body: JSON.stringify(profile)
                });
            },
            // --- הצעות מחיר ---
            async listProposals(pricebookId) {
                return (await this._call('/proposals' + (pricebookId ? ('?pricebookId=' + encodeURIComponent(pricebookId)) : ''))) || [];
            },
            async getProposal(id) { return this._call('/proposals/' + encodeURIComponent(id)); },
            async putProposal(doc) {
                return this._call('/proposals/' + encodeURIComponent(doc.id), {
                    method: 'PUT', body: JSON.stringify(doc)
                });
            },
            async removeProposal(id) {
                return this._call('/proposals/' + encodeURIComponent(id), { method: 'DELETE' });
            },
            async reassignProposal(id, pricebookId) {
                return this._call('/proposals/' + encodeURIComponent(id) + '/reassign', {
                    method: 'PUT', body: JSON.stringify({ pricebookId })
                });
            },
            async extendRetention(id, days) {
                return this._call('/proposals/' + encodeURIComponent(id) + '/retention', {
                    method: 'PUT', body: JSON.stringify({ extendByDays: days })
                });
            },
            // --- פניות "צור קשר מול ONEBTN" על התנגשות הגנת ליד ---
            async createLeadContactRequest(payload) {
                return this._call('/lead-contact-requests', { method: 'POST', body: JSON.stringify(payload) });
            },
            async listLeadContactRequests() { return (await this._call('/lead-contact-requests')) || []; },
            async setLeadContactRequestStatus(id, status) {
                return this._call('/lead-contact-requests/' + encodeURIComponent(id), {
                    method: 'PUT', body: JSON.stringify({ status })
                });
            },
            // --- כניסת מנהל בסיסמה (מעל מפתח הגישה הגולמי) ---
            async adminStatus() { return this._call('/admin/status'); },
            async adminLogin(password) {
                let r;
                try {
                    r = await this._call('/admin/login', { method: 'POST', body: JSON.stringify({ password }) });
                } catch (e) {
                    // סיסמה שגויה (401) וטרם הוגדרה סיסמה (400) הן תשובות רגילות, לא שגיאת שרת
                    if (e && e.status === 400) return { ok: false, error: 'no_password_set' };
                    if (e && e.status === 401) return { ok: false, error: 'bad password' };
                    throw e;
                }
                if (r && r.ok && r.token) writeAdminSessionToken(r.token);
                return r || { ok: false, error: 'bad password' };
            },
            async adminSetPassword(password) {
                try {
                    return await this._call('/admin/password', { method: 'PUT', body: JSON.stringify({ password }) });
                } catch (e) {
                    if (e && e.status === 403) return { ok: false, error: 'forbidden' };
                    if (e && e.status === 400) return { ok: false, error: 'too_short' };
                    throw e;
                }
            }
        });

        const getStorage = () => {
            const cfg = readBackendConfig();
            return cfg.baseUrl ? ApiAdapter(cfg) : LocalAdapter;
        };

        // ============================================================
        //  השוואת מחירונים - לצורך מסך הסנכרון
        // ============================================================
        const SETTING_LABELS = {
            platformPrice: 'מחיר פלטפורמה', platformName: 'שם חבילת הבסיס',
            setupHourlyRate: 'תעריף שעת הקמה', setupHoursPerDay: 'שעות ביום עבודה',
            exchangeRate: 'שער דולר', minMonthlyCharge: 'מינימום חיוב חודשי',
            minModules: 'שווה ערך למודולים'
        };

        const diffConfigs = (mine, theirs) => {
            const out = { added: [], removed: [], changed: [], settings: [] };
            if (!mine || !theirs) return out;
            const mineMods = mine.modules || [], theirMods = theirs.modules || [];
            const byId = (arr) => Object.fromEntries(arr.map(m => [m.id, m]));
            const a = byId(mineMods), b = byId(theirMods);

            theirMods.forEach(m => { if (!a[m.id]) out.added.push(m); });
            mineMods.forEach(m => { if (!b[m.id]) out.removed.push(m); });
            theirMods.forEach(m => {
                const cur = a[m.id];
                if (!cur) return;
                const fields = [];
                [['name', 'שם'], ['price', 'תחזוקה'], ['includedTx', 'מענק טרנזקציות'],
                 ['setupHours', 'שעות הקמה'], ['tier', 'רמה'], ['note', 'תיאור']].forEach(([k, label]) => {
                    if (String(cur[k] ?? '') !== String(m[k] ?? '')) fields.push({ key: k, label, from: cur[k], to: m[k] });
                });
                if (fields.length) out.changed.push({ module: m, fields });
            });

            Object.keys(SETTING_LABELS).forEach(k => {
                if (String(mine[k] ?? '') !== String(theirs[k] ?? '')) {
                    out.settings.push({ key: k, label: SETTING_LABELS[k], from: mine[k], to: theirs[k] });
                }
            });
            out.total = out.added.length + out.removed.length + out.changed.length + out.settings.length;
            return out;
        };

        // לוגו המותג: מנסה קודם את logo.png, אחר כך את הלוגו הישן, ולבסוף טקסט
        const BrandLogo = ({ src, className = "", style = {} }) => {
            const [stage, setStage] = useState(0);
            const chain = [src, 'oneflowlogo.png'];
            if (stage >= chain.length) {
                return (
                    <div className={"flex items-center gap-2 " + className} style={style}>
                        <div className="w-8 h-8 bg-blue-600 text-white rounded-lg flex items-center justify-center font-black text-lg">1</div>
                        <div className="text-xl font-black whitespace-nowrap">ONEFLOW <span className="text-blue-600">PRO</span></div>
                    </div>
                );
            }
            return (
                <img
                    key={stage}
                    src={chain[stage]}
                    alt="ONEFLOW PRO"
                    className={className}
                    style={style}
                    onError={() => setStage(s => s + 1)}
                />
            );
        };

        // רכיב מדרגה (+/-) - מוגדר מחוץ ל-App כדי לשמור על זהות יציבה בין רינדורים.
        // הגדרה בפנים הייתה גורמת ל-React להחשיב אותו כרכיב חדש בכל הקלדה,
        // ולפרק ולבנות מחדש את שדה הקלט - מה שגורם לאיבוד הפוקוס אחרי כל תו.
        const Stepper = ({ value, onChange, min = 0 }) => (
            <div className="flex items-center gap-2">
                <button onClick={() => onChange(Math.max(min, value - 1))}
                    className="w-9 h-9 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center">−</button>
                <input type="number" min={min} value={value}
                    onChange={e => onChange(Math.max(min, Number(e.target.value) || 0))}
                    className="w-16 text-center p-2 border rounded-lg font-black bg-white" />
                <button onClick={() => onChange(value + 1)}
                    className="w-9 h-9 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center">+</button>
            </div>
        );

        // שדות טופס פרופיל, בשימוש גם בשער החובה וגם בטאב "הפרטים שלי".
        // מוגדר מחוץ ל-App מאותה סיבה בדיוק - למנוע איבוד פוקוס תוך כדי הקלדה.
        const ProfileFormFields = ({ value, onChange }) => (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-right">
                {PROFILE_FIELDS.map(k => (
                    <div key={k} className={k === 'address' ? 'md:col-span-2' : ''}>
                        <label className="text-xs font-bold text-slate-600 mb-1 block">{PROFILE_LABELS[k]} *</label>
                        <input value={value[k] || ''} onChange={e => onChange({ ...value, [k]: e.target.value })}
                            dir={k === 'phone' || k === 'email' ? 'ltr' : 'auto'}
                            className="w-full p-3 border rounded-xl bg-white" />
                    </div>
                ))}
            </div>
        );

        function App() {
            const [bootReady, setBootReady] = useState(false);
            const [storage, setStorage] = useState(null);
            const [backendCfg, setBackendCfg] = useState(() => readBackendConfig());
            const [adminTab, setAdminTab] = useState('pricing');

            // שלב אתחול: קוראים את pricing.json כדי לדעת לאיזה שרת לפנות, ורק אז בונים את שכבת האחסון
            useEffect(() => {
                let alive = true;
                fetch(OFFICIAL_URL + '?t=' + Date.now(), { cache: 'no-store' })
                    .then(r => r.ok ? r.json() : Promise.reject(new Error('no seed')))
                    .then(j => { if (j && j.backend) setShippedBackend(j.backend); })
                    .catch(() => {})
                    .finally(() => {
                        if (!alive) return;
                        setBackendCfg(readBackendConfig());
                        setStorage(getStorage());
                        setBootReady(true);
                    });
                return () => { alive = false; };
            }, []);

            const [book, setBook] = useState(null);          // מסמך המחירון הפעיל
            const [master, setMaster] = useState(null);      // מחירון המאסטר, לצורך סנכרון
            const [savedPrint, setSavedPrint] = useState(''); // טביעת אצבע של המצב השמור
            const [loadState, setLoadState] = useState('loading'); // loading | ready | missing | error
            const [loadNote, setLoadNote] = useState('');
            const [authed, setAuthed] = useState(false);
            const [tab, setTab] = useState('quote');         // quote | master

            const isMasterBook = !PARTNER_ID;
            // מחירונים שנשמרו לפני שנוסף proposalDefaults (בשרת אמיתי, בין השאר) יגיעו בלעדיו -
            // מוסיפים ברירת מחדל כאן, כדי לא לקרוס במסך ההגדרות. שמירה חוזרת תתקן את זה לצמיתות.
            const config = (() => {
                const c = (book && book.config) || DEFAULT_CONFIG;
                return c.proposalDefaults ? c : { ...c, proposalDefaults: DEFAULT_CONFIG.proposalDefaults };
            })();

            // ---------- טעינת מסמך המחירון ----------
            const fetchStatic = (url) => fetch(url + '?t=' + Date.now(), { cache: 'no-store' })
                .then(r => r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)));

            const wrapAsBook = (cfg, id, kind) => ({
                id, kind,
                label: cfg.label || (kind === 'master' ? 'מחירון מאסטר' : 'מחירון ' + id),
                implementerName: cfg.implementerName || '',
                auth: null,
                config: migrateConfig(cfg),
                masterVersion: null,
                version: 1,
                updatedAt: cfg.publishedAt || nowIso()
            });

            useEffect(() => {
                if (!storage) return;
                let alive = true;
                (async () => {
                    let masterDoc = null;
                    let masterForbidden = false;
                    try { masterDoc = await storage.get('master'); }
                    catch (e) { if (e && e.status === 403) masterForbidden = true; }

                    if (!masterDoc && !masterForbidden) {
                        try {
                            const j = await fetchStatic(OFFICIAL_URL);
                            masterDoc = wrapAsBook(j, 'master', 'master');
                            try { await storage.put(masterDoc); } catch {}
                        } catch {
                            masterDoc = wrapAsBook(DEFAULT_CONFIG, 'master', 'master');
                        }
                    }
                    if (!alive) return;
                    if (masterDoc) setMaster(masterDoc);

                    if (!PARTNER_ID) {
                        // כניסה כמאסטר עצמו - אם הוגדרה למאסטר סיסמה, נדרשת כניסה בדיוק כמו כל מיישם
                        if (masterForbidden) {
                            let sum = null;
                            try { sum = await storage.summary('master'); } catch {}
                            if (!alive) return;
                            setBook({
                                id: 'master', kind: 'master',
                                label: (sum && sum.label) || 'מחירון מאסטר',
                                implementerName: '', auth: { salt: '', hash: 'gate' },
                                config: DEFAULT_CONFIG, version: 1, updatedAt: nowIso()
                            });
                            setAuthed(false);
                            setLoadState('ready');
                            return;
                        }
                        setBook(masterDoc);
                        setSavedPrint(pricingFingerprint(masterDoc.config));
                        setAuthed(storage.name === 'local' ? !(masterDoc.auth && masterDoc.auth.hash) : true);
                        setLoadState('ready');
                        return;
                    }

                    let doc = masterDoc || wrapAsBook(DEFAULT_CONFIG, 'master', 'master');
                    let note = '';
                    if (PARTNER_ID) {
                        let found = null;
                        let forbidden = false;
                        try { found = await storage.get(PARTNER_ID); }
                        catch (e) { if (e && e.status === 403) forbidden = true; }

                        if (!found && !forbidden) {
                            // תאימות לאחור: מחירון שפורסם כקובץ סטטי (רלוונטי לאחסון מקומי בלבד)
                            try { found = wrapAsBook(await fetchStatic(PRICEBOOK_URL), PARTNER_ID, 'implementer'); }
                            catch {}
                        }

                        if (forbidden) {
                            // המחירון קיים בשרת אך דורש כניסה. שולפים תקציר פומבי לשם התצוגה בלבד.
                            let sum = null;
                            try { sum = await storage.summary(PARTNER_ID); } catch {}
                            if (!alive) return;
                            setBook({
                                id: PARTNER_ID, kind: 'implementer',
                                label: (sum && sum.label) || ('מחירון ' + PARTNER_ID),
                                implementerName: '', auth: { salt: '', hash: 'gate' },
                                config: (masterDoc && masterDoc.config) || DEFAULT_CONFIG, version: 1, updatedAt: nowIso()
                            });
                            setAuthed(false);
                            setLoadState('ready');
                            return;
                        }

                        if (!found) {
                            if (!alive) return;
                            setLoadState('missing');
                            setBook({ ...(masterDoc || wrapAsBook(DEFAULT_CONFIG, 'master', 'master')), id: PARTNER_ID });
                            return;
                        }
                        doc = found;
                    }
                    if (!alive) return;
                    setBook(doc);
                    setSavedPrint(pricingFingerprint(doc.config));
                    // אחסון מקומי: הדפדפן בודק בעצמו אם יש סיסמה. שרת: ההגעה לכאן כבר עברה אימות שם.
                    setAuthed(storage.name === 'local' ? !(doc.auth && doc.auth.hash) : true);
                    setLoadNote(note);
                    setLoadState('ready');
                })().catch(() => { if (alive) setLoadState('error'); });
                return () => { alive = false; };
            }, [storage]);

            // ---------- סנכרון ברקע: בדיקה תקופתית אם המאסטר התעדכן ----------
            useEffect(() => {
                if (isMasterBook || !storage) return;
                const tick = async () => {
                    try {
                        let m = await storage.get('master');
                        if (!m) m = wrapAsBook(await fetchStatic(OFFICIAL_URL), 'master', 'master');
                        setMaster(prev => (prev && pricingFingerprint(prev.config) === pricingFingerprint(m.config)) ? prev : m);
                    } catch {}
                };
                const h = setInterval(tick, 120000);
                return () => clearInterval(h);
            }, [storage, isMasterBook]);

            useEffect(() => {
                if (book && book.implementerName) {
                    setBrand(prev => prev.name ? prev : { ...prev, name: book.implementerName });
                }
            }, [book]);

            const dirty = !!book && pricingFingerprint(book.config) !== savedPrint;
            const masterDiff = useMemo(
                () => (book && master) ? diffConfigs(book.config, master.config) : { added: [], removed: [], changed: [], settings: [], total: 0 },
                [book, master]
            );
            const masterBehind = !isMasterBook && masterDiff.total > 0;

            const pricebookState = (() => {
                if (loadState === 'missing') return {
                    chipText: 'מחירון לא נמצא', icon: 'shield', chipClass: 'bg-red-100 text-red-700',
                    title: 'לא נמצא מחירון למזהה ' + PARTNER_ID + '. מוצג מחירון המאסטר במקומו.'
                };
                if (dirty) return {
                    chipText: 'שינויים לא שמורים', icon: 'unlock', chipClass: 'bg-amber-100 text-amber-800',
                    title: 'יש שינויים שטרם נשמרו במחירון.'
                };
                if (isMasterBook) return {
                    chipText: 'מחירון מאסטר', icon: 'check-circle-2', chipClass: 'bg-emerald-100 text-emerald-700',
                    title: 'מחירון המאסטר. ממנו נוצרים מחירוני המיישמים.'
                };
                return {
                    chipText: (book && book.label) || ('מחירון ' + PARTNER_ID), icon: 'check-circle-2',
                    chipClass: 'bg-blue-100 text-blue-700',
                    title: 'המחירון האישי שלך.'
                };
            })();

            // ---------- שמירה וגרסאות ----------
            const saveBook = async (note) => {
                if (!book) return;
                const next = { ...book, version: (Number(book.version) || 0) + 1, updatedAt: nowIso() };
                await storage.put(next);
                try {
                    await storage.putVersion(next.id, {
                        id: newId('v'), at: next.updatedAt, note: note || 'עדכון מחירון',
                        version: next.version, config: next.config,
                        label: next.label, implementerName: next.implementerName
                    });
                } catch {}
                setBook(next);
                setSavedPrint(pricingFingerprint(next.config));
                if (next.id === 'master') setMaster(next);
                return next;
            };

            const submitPassword = async (e) => {
                e.preventDefault();
                setPwError('');
                try {
                    const ok = await storage.verifyPassword(book.id, pwInput);
                    if (!ok) { setPwError('סיסמה שגויה.'); return; }
                    // בשרת, המסמך המלא נגיש רק לאחר שהאסימון נשמר - נשלוף אותו כעת
                    if (storage.name !== 'local') {
                        const full = await storage.get(book.id);
                        if (full) { setBook(full); setSavedPrint(pricingFingerprint(full.config)); }
                        // אם המאסטר היה חסום קודם (מוגן בסיסמה), הכניסה עכשיו פותחת גישה אליו
                        if (book.id !== 'master') {
                            try { const m = await storage.get('master'); if (m) setMaster(m); } catch {}
                        }
                    }
                    setAuthed(true);
                    setPwInput('');
                } catch (err) { setPwError('בדיקת הסיסמה נכשלה: ' + (err.message || err)); }
            };

            // הוגדר כאן, לפני האפקט שמסתמך עליו למטה - הסתמכות על משתנה שמוגדר
            // אחרי נקודת השימוש בו בקוד המקור גורמת לכך שהאפקט "רואה" תמיד undefined
            // במערך התלויות שלו, ולכן אינו מתעדכן שוב כשהמצב באמת משתנה.
            const [isAdminOpen, setIsAdminOpen] = useState(false);

            const refreshBooks = async () => {
                if (!storage) return;
                try { setBooks(await storage.list()); } catch { setBooks([]); }
            };
            const refreshVersions = async () => {
                if (!book || !storage) return;
                try { setVersions(await storage.listVersions(book.id)); } catch { setVersions([]); }
            };
            useEffect(() => {
                if (!isAdminOpen || !storage) return;
                refreshBooks();
                refreshVersions();
            }, [isAdminOpen, storage, book && book.id]);

            // ---------- אומדנים על שם לקוח ----------
            const refreshQuotes = async () => {
                if (!book || !storage) return;
                try { setQuotes(await storage.listQuotes(book.id)); } catch { setQuotes([]); }
            };
            useEffect(() => {
                if (tab !== 'quotes' || !book || !storage) return;
                refreshQuotes();
            }, [tab, storage, book && book.id]);

            const buildSelection = () => ({
                clientName, quoteDate, selectedModules, extraTxPacks, hoursOverride,
                extraUserPacks, customSelections
            });
            const applySelection = (sel) => {
                if (!sel) return;
                setClientName(sel.clientName || '');
                setQuoteDate(sel.quoteDate || new Date().toISOString().split('T')[0]);
                setSelectedModules(sel.selectedModules || []);
                setExtraTxPacks(sel.extraTxPacks || 0);
                setHoursOverride(sel.hoursOverride || {});
                setExtraUserPacks(sel.extraUserPacks || 0);
                setCustomSelections(sel.customSelections || {});
            };

            const newQuote = () => {
                setActiveQuoteId(null);
                setQuoteNote('');
                setClientName('');
                setQuoteDate(new Date().toISOString().split('T')[0]);
                setSelectedModules([]);
                setExtraTxPacks(0);
                setHoursOverride({});
                setExtraUserPacks(0);
                setCustomSelections({});
                setTab('quote');
            };

            const saveQuote = async () => {
                if (!book || !storage) return;
                if (!clientName.trim()) { alert('יש להזין שם לקוח לפני שמירה.'); return; }
                const id = activeQuoteId || newId('q');
                const doc = {
                    id, clientName: clientName.trim(), implementerName: book.implementerName || brand.name || '',
                    note: quoteNote || '', selection: buildSelection(),

            const openQuote = (q) => {

            const duplicateQuote = async (q) => {
                if (!book || !storage) return;

                    id: newId('q'), clientName: q.clientName + ' (עותק)',

                };
                try { await storage.putQuote(book.id, copy); await refreshQuotes(); }

            const deleteQuote = async (q) => {
                if (!book || !storage) return;
                if (!window.confirm('למחוק את האומדן של ' + q.clientName + '? הפעולה אינה הפיכה.')) return;

                    await storage.removeQuote(book.id, q.id);

                    await refreshQuotes();
                } catch (e) { alert('המחיקה נכשלה: ' + (e.message || e)); }

            // ---------- לידים - מחירון המאסטר בלבד ----------
            const refreshLeads = async () => {
                if (!storage || !isMasterBook) return;
                try { setLeads(await storage.listLeads()); } catch { setLeads([]); }
            };
            useEffect(() => {
                if (tab !== 'leads' || !storage || !isMasterBook) return;
                refreshLeads();
            }, [tab, storage, isMasterBook]);

            // ---------- הצעות מחיר ----------
            // ברירות מחדל גלובליות: ימי שמירה וטקסטים, נשמרים במחירון המאסטר
            const proposalDefaults = (master && master.config && master.config.proposalDefaults) || {};
            const defaultRetentionDays = Number(proposalDefaults.retentionDays) > 0 ? Number(proposalDefaults.retentionDays) : DEFAULT_RETENTION_DAYS;

            const refreshProposals = async () => {
                if (!storage || !book) return;

            };
            useEffect(() => {
                if (tab !== 'proposals' || !storage || !book) return;

            }, [tab, storage, book && book.id]);

            // מוגדר כאן, לפני האפקט שמסתמך עליו במערך התלויות שלו למטה - ראו הערה דומה ליד isAdminOpen
            const [expandedPartnerId, setExpandedPartnerId] = useState(null);

            // פרטי מיישם מורחבים - אומדנים והצעות מחיר, לתצוגת המנהל בלבד
            const refreshPartnerDetail = async (pricebookId) => {
                if (!pricebookId || !storage) return;

                    storage.listQuotes(pricebookId).catch(() => []),
                    storage.listProposals(pricebookId).catch(() => [])

            };
            useEffect(() => {
                if (!expandedPartnerId || !storage) { setPartnerDetail({ quotes: [], proposals: [] }); return; }
                let alive = true;
                (async () => {
                    const [qs, ps] = await Promise.all([
                        storage.listQuotes(expandedPartnerId).catch(() => []),
                        storage.listProposals(expandedPartnerId).catch(() => [])
                    ]);
                    if (alive) setPartnerDetail({ quotes: qs || [], proposals: ps || [] });
                })();
                return () => { alive = false; };
            }, [expandedPartnerId, storage]);

            const emptyClientDetails = () => ({
                clientName: '', clientBusinessId: '', clientContactName: '', clientPhone: '', clientEmail: '', clientAddress: ''
            });

            // פותח את עורך ההצעה עם תוכן אומדן קיים (המרת אומדן להצעת מחיר)
            const openProposalFromQuote = (q, targetPricebookId) => {
                setProposalEditor({
                    id: null, pricebookId: targetPricebookId || book.id, sourceQuoteId: q.id,
                    ...emptyClientDetails(), clientName: q.clientName || '',
                    introText: proposalDefaults.introText || '', termsText: proposalDefaults.termsText || '',
                    closingText: proposalDefaults.closingText || '',
                    selection: q.selection || {}, totals: q.totals || {}, status: 'open',
                    retentionDays: defaultRetentionDays
                });
                setLeadWarningInfo(null);
                setTab('proposals');
            };

            // המנהל בונה הצעה מהאומדן הפתוח אצלו כרגע, ומשייך למיישם לפי בחירה
            const openProposalFromCurrentBuild = (targetPricebookId) => {
                openProposalFromQuote({
                    id: null, clientName, selection: buildSelection(),
                    totals: {
                        totalMRR: totals.totalMRR, totalSetup: totals.totalSetup,
                        moduleCount: totals.moduleCount, monthlyTx: totals.monthlyTx, totalUsers: totals.totalUsers
                    }
                }, targetPricebookId || book.id);
            };

            const openProposalForEdit = (p) => {
                setProposalEditor({
                    id: p.id, pricebookId: p.pricebookId, sourceQuoteId: p.sourceQuoteId,
                    clientName: p.clientName || '', clientBusinessId: p.clientBusinessId || '',
                    clientContactName: p.clientContactName || '', clientPhone: p.clientPhone || '',
                    clientEmail: p.clientEmail || '', clientAddress: p.clientAddress || '',
                    introText: p.introText || '', termsText: p.termsText || '', closingText: p.closingText || '',
                    selection: p.selection || {}, totals: p.totals || {}, status: p.status || 'open',
                    retentionDays: p.retentionDays || defaultRetentionDays

                setLeadWarningInfo(null);
