        // --- עזרי פורמט ---
        const fmt   = (n) => Math.round(Number(n) || 0).toLocaleString('he-IL');
        const money = (n) => fmt(n) + ' ₪';
        const usd   = (n, rate) => '≈ $' + fmt((Number(n) || 0) / (Number(rate) || 3.7));

        // הקטנת תמונה לפני שמירה בדפדפן (כדי לא לחרוג ממגבלת האחסון)
        const resizeImage = (file, maxWidth, callback) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, maxWidth / img.width);
                    const w = Math.round(img.width * scale);
                    const h = Math.round(img.height * scale);
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/png'));
                };
                img.onerror = () => callback(null);
                img.src = e.target.result;
            };
            reader.onerror = () => callback(null);
            reader.readAsDataURL(file);
        };

        // מיגרציה: התאמת קובץ הגדרות ישן למבנה החדש
        const migrateConfig = (raw) => {
            const c = { ...DEFAULT_CONFIG, ...raw };
            c.moduleTiers = { ...DEFAULT_CONFIG.moduleTiers, ...(raw.moduleTiers || {}) };
            c.uiText      = { ...DEFAULT_CONFIG.uiText,      ...(raw.uiText || {}) };
            c.extraTxPack = { ...DEFAULT_CONFIG.extraTxPack, ...(raw.extraTxPack || {}) };
            c.users       = { ...DEFAULT_CONFIG.users,       ...(raw.users || {}) };
            if (!Array.isArray(c.txStations) || !c.txStations.length) c.txStations = DEFAULT_CONFIG.txStations;
            c.minModules = Number(raw.minModules !== undefined ? raw.minModules : DEFAULT_CONFIG.minModules) || 0;
            c.minMonthlyCharge = Number(raw.minMonthlyCharge !== undefined ? raw.minMonthlyCharge : DEFAULT_CONFIG.minMonthlyCharge) || 0;
            if (!Array.isArray(c.customSections)) c.customSections = [];

            c.modules = (Array.isArray(raw.modules) ? raw.modules : DEFAULT_CONFIG.modules).map(m => {
                const tier = (m.tier === 'premium') ? 'premium' : 'basic';
                const tierDef = c.moduleTiers[tier];
                return {
                    id: m.id || ('mod_' + Math.random().toString(36).slice(2)),
                    name: m.name || 'מודול',
                    icon: m.icon || 'package',
                    tier,
                    // גרסה ישנה עבדה בימי הקמה - ממירים לשעות
                    setupHours: Number(
                        m.setupHours !== undefined
                            ? m.setupHours
                            : (Number(m.setupDays || 0) * Number(raw.setupHoursPerDay || DEFAULT_CONFIG.setupHoursPerDay))
                    ) || 0,
                    price: Number(m.price !== undefined ? m.price : tierDef.price) || 0,
                    includedTx: Number(m.includedTx !== undefined ? m.includedTx : tierDef.tx) || 0,
                    note: m.note || ''
                };
            });

            // הזרמת מודולים שנוספו לקטלוג אל מחירונים שנשמרו בגרסה קודמת.
            // מתבצע פעם אחת בלבד לכל גרסת קטלוג, כדי לא לשחזר מודולים שנמחקו ביודעין.
            const savedVersion = Number(raw.catalogVersion) || 0;
            if (savedVersion < CATALOG_VERSION) {
                const existing = new Set(c.modules.map(m => m.id));
                for (let v = savedVersion + 1; v <= CATALOG_VERSION; v++) {
                    (CATALOG_ADDITIONS[v] || []).forEach(id => {
                        if (existing.has(id)) return;
                        const dm = DEFAULT_CONFIG.modules.find(m => m.id === id);
                        if (dm) { c.modules.push(JSON.parse(JSON.stringify(dm))); existing.add(id); }
                    });
                }
            }
            c.catalogVersion = CATALOG_VERSION;

            // ניקוי שדות שאינם בשימוש במודל החדש

            delete c.privateUserPackages;

            delete c.aiPackages;
            delete c.enableAI;
            delete c.enableGlobalTiers;
            delete c.enableTiers;
            delete c.enableUsers;
            delete c.tiers;
            return c;

        // ============================================================

        //  מעבר ביניהם נעשה בהגדרת כתובת השרת במסך הניהול בלבד.
        // ============================================================
        const BACKEND_KEY = 'oneflow_backend_v1';
        const LOCAL_DB_KEY = 'oneflow_pricebooks_v1';

        const DEFAULT_ORG_SLUG = 'onebtn_team';

        // ברירת המחדל מגיעה עם האתר (שדה backend ב-pricing.json), כדי שכל מיישם
        // יתחבר לשרת אוטומטית. עקיפה מקומית, אם קיימת, גוברת עליה.
        let SHIPPED_BACKEND = { baseUrl: '', orgSlug: DEFAULT_ORG_SLUG, extraHeaders: '' };
        const setShippedBackend = (b) => {
            if (!b || typeof b !== 'object') return;
            SHIPPED_BACKEND = {
                baseUrl: (b.baseUrl || '').replace(/\/+$/, ''),
                orgSlug: b.orgSlug !== undefined ? b.orgSlug : DEFAULT_ORG_SLUG,
                extraHeaders: b.extraHeaders || ''
            };
        };

        const readLocalBackendOverride = () => {
            try { return JSON.parse(localStorage.getItem(BACKEND_KEY) || 'null'); }
            catch { return null; }
        };

        const readBackendConfig = () => {
            const o = readLocalBackendOverride() || {};
            const pick = (k, d) => (o[k] !== undefined && o[k] !== '') ? o[k] : d;
            return {
                baseUrl: String(pick('baseUrl', SHIPPED_BACKEND.baseUrl)).replace(/\/+$/, ''),
                token: o.token || '',
                orgSlug: pick('orgSlug', SHIPPED_BACKEND.orgSlug),
                extraHeaders: pick('extraHeaders', SHIPPED_BACKEND.extraHeaders)
            };
        };

        // כותרות נוספות, שורה לכל אחת בתבנית  שם: ערך
        const parseExtraHeaders = (text) => {
            const out = {};
            (text || '').split(/\r?\n/).forEach(line => {
                const i = line.indexOf(':');
                if (i < 1) return;
                const k = line.slice(0, i).trim();
                const v = line.slice(i + 1).trim();
                if (k && v) out[k] = v;
            });
            return out;
        };

        // כל הכותרות הנשלחות בבקשה לשרת
        const buildHeaders = (cfg, extra) => ({
            'Content-Type': 'application/json',
            ...(cfg.token ? { 'Authorization': 'Bearer ' + cfg.token } : {}),
            ...(cfg.orgSlug ? { 'x-org-slug': cfg.orgSlug } : {}),
            ...parseExtraHeaders(cfg.extraHeaders),
            ...(extra || {})
        });
        const writeBackendConfig = (c) => {
            try { localStorage.setItem(BACKEND_KEY, JSON.stringify(c)); } catch {}
        };

        const nowIso = () => new Date().toISOString();
        const newId = (p) => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

        // --- הצפנת סיסמאות (Web Crypto) ---
        const randomSalt = () => {
            const a = new Uint8Array(16);
            (window.crypto || {}).getRandomValues?.(a);
            return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
        };
        const sha256Hex = async (text) => {
            const subtle = window.crypto && window.crypto.subtle;
            if (!subtle) throw new Error('crypto unavailable');
            const buf = await subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        };
        const hashPassword = async (password, salt) => sha256Hex(salt + '|' + password);
        const cryptoAvailable = () => !!(window.crypto && window.crypto.subtle);

        // --- מתאם מקומי: דפדפן בלבד ---
        const LocalAdapter = {
            name: 'local',
            isConnected: false,
            _read() {
                try { return JSON.parse(localStorage.getItem(LOCAL_DB_KEY) || '{"books":{},"versions":{}}'); }
                catch { return { books: {}, versions: {} }; }
            },
            _write(db) {
                try { localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(db)); return true; }
                catch { return false; }
            },
            async list() {
                const db = this._read();
                return Object.values(db.books).map(b => ({
                    id: b.id, label: b.label, kind: b.kind, implementerName: b.implementerName,
                    updatedAt: b.updatedAt, version: b.version, hasPassword: !!(b.auth && b.auth.hash)
                }));
            },
            async get(id) { return this._read().books[id] || null; },
            async put(doc) {
                const db = this._read();
                db.books[doc.id] = doc;
                if (!this._write(db)) throw new Error('storage full');
                return doc;
            },
            async remove(id) {
                const db = this._read();
                delete db.books[id];
                delete db.versions[id];
                this._write(db);
            },
            async listVersions(id) {
                const db = this._read();
                return (db.versions[id] || []).map(v => ({ id: v.id, at: v.at, note: v.note, version: v.version }));
            },
            async getVersion(id, vid) {
                const db = this._read();
                return (db.versions[id] || []).find(v => v.id === vid) || null;
            },
            async putVersion(id, entry) {
                const db = this._read();
                const list = db.versions[id] || [];
                list.unshift(entry);
                db.versions[id] = list.slice(0, 40); // שומרים היסטוריה סבירה בלבד
                this._write(db);
                return entry;
            },
            async verifyPassword(id, password) {
                const book = await this.get(id);
                if (!book || !book.auth || !book.auth.hash) return true;
                try { return (await hashPassword(password, book.auth.salt)) === book.auth.hash; }
                catch { return false; }
            }
        };

        // --- מתאם שרת: מופעל ברגע שמוגדרת כתובת ---
        const ApiAdapter = (cfg) => ({
            name: 'api',
            isConnected: true,
            baseUrl: cfg.baseUrl,
            async _call(path, options = {}) {
                const res = await fetch(this.baseUrl + path, {
                    ...options,
                    headers: buildHeaders(cfg, options.headers)
                });
                if (res.status === 404) return null;
                if (!res.ok) throw new Error('שגיאת שרת ' + res.status);
                return res.status === 204 ? null : res.json();
            },
            async list() { return (await this._call('/pricebooks')) || []; },
            async get(id) { return this._call('/pricebooks/' + encodeURIComponent(id)); },
            async put(doc) {
                return this._call('/pricebooks/' + encodeURIComponent(doc.id), {
                    method: 'PUT', body: JSON.stringify(doc)
                });
            },
            async remove(id) {
                return this._call('/pricebooks/' + encodeURIComponent(id), { method: 'DELETE' });
            },
            async listVersions(id) {
                return (await this._call('/pricebooks/' + encodeURIComponent(id) + '/versions')) || [];
            },
            async getVersion(id, vid) {
                return this._call('/pricebooks/' + encodeURIComponent(id) + '/versions/' + encodeURIComponent(vid));
            },
            async putVersion(id, entry) {
                return this._call('/pricebooks/' + encodeURIComponent(id) + '/versions', {
                    method: 'POST', body: JSON.stringify(entry)
                });
            },
            // אימות הסיסמה נעשה בשרת, כך שההצפנה אינה נחשפת בדפדפן
            async verifyPassword(id, password) {
                const r = await this._call('/pricebooks/' + encodeURIComponent(id) + '/auth', {
                    method: 'POST', body: JSON.stringify({ password })
                });
                return !!(r && r.ok);
            }
        });

        const getStorage = () => {
            const cfg = readBackendConfig();
            return cfg.baseUrl ? ApiAdapter(cfg) : LocalAdapter;
        };

        // ============================================================
        //  השוואת מחירונים - לצורך מסך הסנכרון
        // ============================================================
        const SETTING_LABELS = {
            platformPrice: 'מחיר פלטפורמה', platformName: 'שם חבילת הבסיס',
            setupHourlyRate: 'תעריף שעת הקמה', setupHoursPerDay: 'שעות ביום עבודה',
            exchangeRate: 'שער דולר', minMonthlyCharge: 'מינימום חיוב חודשי',
            minModules: 'שווה ערך למודולים'
        };

        const diffConfigs = (mine, theirs) => {
            const out = { added: [], removed: [], changed: [], settings: [] };
            if (!mine || !theirs) return out;
            const mineMods = mine.modules || [], theirMods = theirs.modules || [];
            const byId = (arr) => Object.fromEntries(arr.map(m => [m.id, m]));
            const a = byId(mineMods), b = byId(theirMods);

            theirMods.forEach(m => { if (!a[m.id]) out.added.push(m); });
            mineMods.forEach(m => { if (!b[m.id]) out.removed.push(m); });
            theirMods.forEach(m => {
                const cur = a[m.id];
                if (!cur) return;
                const fields = [];
                [['name', 'שם'], ['price', 'תחזוקה'], ['includedTx', 'מענק טרנזקציות'],
                 ['setupHours', 'שעות הקמה'], ['tier', 'רמה'], ['note', 'תיאור']].forEach(([k, label]) => {
                    if (String(cur[k] ?? '') !== String(m[k] ?? '')) fields.push({ key: k, label, from: cur[k], to: m[k] });
                });
                if (fields.length) out.changed.push({ module: m, fields });
            });

            Object.keys(SETTING_LABELS).forEach(k => {
                if (String(mine[k] ?? '') !== String(theirs[k] ?? '')) {
                    out.settings.push({ key: k, label: SETTING_LABELS[k], from: mine[k], to: theirs[k] });
                }
            });
            out.total = out.added.length + out.removed.length + out.changed.length + out.settings.length;
            return out;
        };

        // לוגו המותג: מנסה קודם את logo.png, אחר כך את הלוגו הישן, ולבסוף טקסט
        const BrandLogo = ({ src, className = "", style = {} }) => {
            const [stage, setStage] = useState(0);
            const chain = [src, 'oneflowlogo.png'];
            if (stage >= chain.length) {
                return (
                    <div className={"flex items-center gap-2 " + className} style={style}>
                        <div className="w-8 h-8 bg-blue-600 text-white rounded-lg flex items-center justify-center font-black text-lg">1</div>
                        <div className="text-xl font-black whitespace-nowrap">ONEFLOW <span className="text-blue-600">PRO</span></div>
                    </div>
                );
            }
            return (
                <img
                    key={stage}
                    src={chain[stage]}
                    alt="ONEFLOW PRO"
                    className={className}
                    style={style}
                    onError={() => setStage(s => s + 1)}
                />
            );
        };

        function App() {
            const [bootReady, setBootReady] = useState(false);
            const [storage, setStorage] = useState(null);
            const [backendCfg, setBackendCfg] = useState(() => readBackendConfig());
            const [adminTab, setAdminTab] = useState('pricing');

            // שלב אתחול: קוראים את pricing.json כדי לדעת לאיזה שרת לפנות, ורק אז בונים את שכבת האחסון
            useEffect(() => {
                let alive = true;
                fetch(OFFICIAL_URL + '?t=' + Date.now(), { cache: 'no-store' })
                    .then(r => r.ok ? r.json() : Promise.reject(new Error('no seed')))
                    .then(j => { if (j && j.backend) setShippedBackend(j.backend); })
                    .catch(() => {})
                    .finally(() => {
                        if (!alive) return;
                        setBackendCfg(readBackendConfig());
                        setStorage(getStorage());
                        setBootReady(true);
                    });
                return () => { alive = false; };
            }, []);

            const [book, setBook] = useState(null);          // מסמך המחירון הפעיל
            const [master, setMaster] = useState(null);      // מחירון המאסטר, לצורך סנכרון
            const [savedPrint, setSavedPrint] = useState(''); // טביעת אצבע של המצב השמור
            const [loadState, setLoadState] = useState('loading'); // loading | ready | missing | error
            const [loadNote, setLoadNote] = useState('');
            const [authed, setAuthed] = useState(false);
            const [tab, setTab] = useState('quote');         // quote | master

            const isMasterBook = !PARTNER_ID;
            const config = (book && book.config) || DEFAULT_CONFIG;

            // ---------- טעינת מסמך המחירון ----------
            const fetchStatic = (url) => fetch(url + '?t=' + Date.now(), { cache: 'no-store' })
                .then(r => r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)));

            const wrapAsBook = (cfg, id, kind) => ({
                id, kind,
                label: cfg.label || (kind === 'master' ? 'מחירון מאסטר' : 'מחירון ' + id),
                implementerName: cfg.implementerName || '',
                auth: null,
                config: migrateConfig(cfg),
                masterVersion: null,
                version: 1,
                updatedAt: cfg.publishedAt || nowIso()
            });

            useEffect(() => {
                if (!storage) return;
                let alive = true;
                (async () => {
                    let masterDoc = null;
                    try { masterDoc = await storage.get('master'); } catch {}
                    if (!masterDoc) {
                        try {
                            const j = await fetchStatic(OFFICIAL_URL);
                            masterDoc = wrapAsBook(j, 'master', 'master');
                            try { await storage.put(masterDoc); } catch {}
                        } catch {
                            masterDoc = wrapAsBook(DEFAULT_CONFIG, 'master', 'master');
                        }
                    }
                    if (!alive) return;
                    setMaster(masterDoc);

                    let doc = masterDoc;
                    let note = '';
                    if (PARTNER_ID) {
                        let found = null;
                        try { found = await storage.get(PARTNER_ID); } catch {}
                        if (!found) {
                            // תאימות לאחור: מחירון שפורסם כקובץ סטטי
                            try { found = wrapAsBook(await fetchStatic(PRICEBOOK_URL), PARTNER_ID, 'implementer'); }
                            catch {}
                        }
                        if (!found) {
                            if (!alive) return;
                            setLoadState('missing');
                            setBook({ ...masterDoc, id: PARTNER_ID });
                            return;
                        }
                        doc = found;
                    }
                    if (!alive) return;
                    setBook(doc);
                    setSavedPrint(pricingFingerprint(doc.config));
                    setAuthed(!(doc.auth && doc.auth.hash));
                    setLoadNote(note);
                    setLoadState('ready');
                })().catch(() => { if (alive) setLoadState('error'); });
                return () => { alive = false; };
            }, [storage]);

            // ---------- סנכרון ברקע: בדיקה תקופתית אם המאסטר התעדכן ----------
            useEffect(() => {
                if (isMasterBook || !storage) return;
                const tick = async () => {
                    try {
                        let m = await storage.get('master');
                        if (!m) m = wrapAsBook(await fetchStatic(OFFICIAL_URL), 'master', 'master');
                        setMaster(prev => (prev && pricingFingerprint(prev.config) === pricingFingerprint(m.config)) ? prev : m);
                    } catch {}
                };
                const h = setInterval(tick, 120000);
                return () => clearInterval(h);
            }, [storage, isMasterBook]);

            useEffect(() => {
                if (book && book.implementerName) {
                    setBrand(prev => prev.name ? prev : { ...prev, name: book.implementerName });
                }
            }, [book]);

            const dirty = !!book && pricingFingerprint(book.config) !== savedPrint;
            const masterDiff = useMemo(
                () => (book && master) ? diffConfigs(book.config, master.config) : { added: [], removed: [], changed: [], settings: [], total: 0 },
                [book, master]
            );
            const masterBehind = !isMasterBook && masterDiff.total > 0;

            const pricebookState = (() => {
                if (loadState === 'missing') return {
                    chipText: 'מחירון לא נמצא', icon: 'shield', chipClass: 'bg-red-100 text-red-700',
                    title: 'לא נמצא מחירון למזהה ' + PARTNER_ID + '. מוצג מחירון המאסטר במקומו.'
                };
                if (dirty) return {
                    chipText: 'שינויים לא שמורים', icon: 'unlock', chipClass: 'bg-amber-100 text-amber-800',
                    title: 'יש שינויים שטרם נשמרו במחירון.'
                };
                if (isMasterBook) return {
                    chipText: 'מחירון מאסטר', icon: 'check-circle-2', chipClass: 'bg-emerald-100 text-emerald-700',
                    title: 'מחירון המאסטר. ממנו נוצרים מחירוני המיישמים.'
                };
                return {
                    chipText: (book && book.label) || ('מחירון ' + PARTNER_ID), icon: 'check-circle-2',
                    chipClass: 'bg-blue-100 text-blue-700',
                    title: 'המחירון האישי שלך.'
                };
            })();

            // ---------- שמירה וגרסאות ----------
            const saveBook = async (note) => {
                if (!book) return;
                const next = { ...book, version: (Number(book.version) || 0) + 1, updatedAt: nowIso() };
                await storage.put(next);
                try {
                    await storage.putVersion(next.id, {
                        id: newId('v'), at: next.updatedAt, note: note || 'עדכון מחירון',
                        version: next.version, config: next.config,
                        label: next.label, implementerName: next.implementerName
                    });
                } catch {}
                setBook(next);
                setSavedPrint(pricingFingerprint(next.config));
                if (next.id === 'master') setMaster(next);
                return next;
            };

            const submitPassword = async (e) => {
                e.preventDefault();
                setPwError('');
                try {
                    const ok = await storage.verifyPassword(book.id, pwInput);
                    if (ok) { setAuthed(true); setPwInput(''); }
                    else setPwError('סיסמה שגויה.');
                } catch (err) { setPwError('בדיקת הסיסמה נכשלה: ' + (err.message || err)); }
            };

            const refreshBooks = async () => {
                if (!storage) return;
                try { setBooks(await storage.list()); } catch { setBooks([]); }
            };
            const refreshVersions = async () => {
                if (!book || !storage) return;
                try { setVersions(await storage.listVersions(book.id)); } catch { setVersions([]); }
            };
            useEffect(() => {
                if (!isAdminOpen || !storage) return;
                refreshBooks();
                refreshVersions();
            }, [isAdminOpen, storage, book && book.id]);

            const slugify = (v) => v.toLowerCase().trim().replace(/[^a-z0-9_-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 40);

            // יצירת מחירון למיישם מתוך מחירון המאסטר
            const generatePricebook = async () => {
                setGenError(''); setGenResult(null);
                const id = slugify(genForm.id);
                if (!id) { setGenError('יש להזין מזהה באותיות אנגליות.'); return; }
                if (id === 'master') { setGenError('המזהה master שמור למחירון המאסטר.'); return; }
                if (!genForm.password || genForm.password.length < 4) { setGenError('סיסמה חייבת להכיל 4 תווים לפחות.'); return; }
                if (!cryptoAvailable()) { setGenError('הדפדפן אינו תומך בהצפנה. יש לפתוח את האתר דרך https.'); return; }
                setBusy('gen');
                try {
                    const existing = await storage.get(id);
                    if (existing && !window.confirm('כבר קיים מחירון במזהה ' + id + '. להחליף אותו?')) { setBusy(''); return; }
                    const salt = randomSalt();
                    const hash = await hashPassword(genForm.password, salt);
                    const doc = {
                        id, kind: 'implementer',
                        label: genForm.label || ('מחירון ' + id),
                        implementerName: genForm.implementerName || '',
                        auth: { salt, hash },
                        config: JSON.parse(JSON.stringify(config)),
                        masterVersion: (book && book.version) || 1,
                        version: 1, updatedAt: nowIso()
                    };
                    await storage.put(doc);
                    try {
                        await storage.putVersion(id, {
                            id: newId('v'), at: doc.updatedAt, note: 'נוצר ממחירון המאסטר',
                            version: 1, config: doc.config, label: doc.label, implementerName: doc.implementerName
                        });
                    } catch {}
                    setGenResult({
                        id,
                        link: window.location.origin + window.location.pathname + '?p=' + id,
                        password: genForm.password
                    });
                    setGenForm({ id: '', label: '', implementerName: '', password: '' });
                    await refreshBooks();
                } catch (e) { setGenError('היצירה נכשלה: ' + (e.message || e)); }
                setBusy('');
            };

            const resetBookPassword = async (id) => {
                const pw = window.prompt('סיסמה חדשה למחירון ' + id + ':');
                if (!pw) return;
                if (pw.length < 4) { alert('סיסמה חייבת להכיל 4 תווים לפחות.'); return; }
                try {
                    const doc = await storage.get(id);
                    if (!doc) return;
                    const salt = randomSalt();
                    doc.auth = { salt, hash: await hashPassword(pw, salt) };
                    doc.updatedAt = nowIso();
                    await storage.put(doc);
                    await refreshBooks();
                    alert('הסיסמה עודכנה. מסור אותה למיישם.');
                } catch (e) { alert('עדכון הסיסמה נכשל: ' + (e.message || e)); }
            };

            const deleteBook = async (id) => {
                if (id === 'master') { alert('לא ניתן למחוק את מחירון המאסטר.'); return; }
                if (!window.confirm('למחוק לצמיתות את המחירון ' + id + ' ואת היסטוריית הגרסאות שלו?')) return;
                try { await storage.remove(id); await refreshBooks(); }
                catch (e) { alert('המחיקה נכשלה: ' + (e.message || e)); }
            };

            const restoreVersion = async (vid) => {
                if (!book) return;
                if (!window.confirm('לשחזר את המחירון לגרסה זו? המצב הנוכחי יישמר כגרסה חדשה.')) return;
                try {
                    const v = await storage.getVersion(book.id, vid);
                    if (!v) { alert('הגרסה לא נמצאה.'); return; }
                    setBook(prev => ({ ...prev, config: JSON.parse(JSON.stringify(v.config)) }));
                    alert('הגרסה נטענה. לחץ "שמור" כדי לקבע אותה.');
                } catch (e) { alert('השחזור נכשל: ' + (e.message || e)); }
            };

            const [connTest, setConnTest] = useState(null);

            // בדיקת חיבור: שולחת בקשה אמיתית עם כל הכותרות ומדווחת מה חזר
            const testConnection = async (cfg) => {
                if (!cfg.baseUrl) { setConnTest({ ok: false, msg: 'יש להזין כתובת API.' }); return; }
                setConnTest({ pending: true });
                const headers = buildHeaders(cfg);
                try {
                    const res = await fetch(cfg.baseUrl.replace(/\/+$/, '') + '/pricebooks', { headers });
                    if (res.ok) {
                        let n = '';
                        try { const j = await res.json(); if (Array.isArray(j)) n = ' · ' + j.length + ' מחירונים'; } catch {}
                        setConnTest({ ok: true, msg: 'החיבור תקין (' + res.status + ')' + n, sent: Object.keys(headers) });
                    } else {
                        setConnTest({ ok: false, msg: 'השרת החזיר ' + res.status + ' ' + res.statusText, sent: Object.keys(headers) });
                    }
                } catch (e) {
                    setConnTest({ ok: false, msg: 'לא ניתן להגיע לשרת: ' + (e.message || e), sent: Object.keys(headers) });
                }
            };

            // טאבים במסך הניהול. הגדרות המערכת והמיישמים גלויות רק במחירון המאסטר.
            const ADMIN_TABS = [
                { id: 'pricing', label: 'מחירון', icon: 'coins', masterOnly: false },
                { id: 'brand',   label: 'מיתוג',  icon: 'image', masterOnly: false },
                { id: 'versions',label: 'גרסאות', icon: 'clock', masterOnly: false },
                { id: 'partners',label: 'מיישמים', icon: 'users', masterOnly: true },
                { id: 'system',  label: 'מערכת',  icon: 'server', masterOnly: true },
            ].filter(t => !t.masterOnly || isMasterBook);

            const applyBackendConfig = (cfg) => {
                writeBackendConfig(cfg);
                setBackendCfg(cfg);
                setStorage(getStorage());
                setLoadState('loading');
            };

            const setConfig = (updater) => {
                setBook(prev => {
                    if (!prev) return prev;
                    const nextCfg = typeof updater === 'function' ? updater(prev.config) : updater;
                    return { ...prev, config: nextCfg };
                });
            };


            // מיתוג המיישם - נשמר בנפרד מהמחירון כדי לשרוד איפוס הגדרות
            const [brand, setBrand] = useState(() => {
                try {
                    const saved = localStorage.getItem(BRAND_KEY);
                    return saved ? JSON.parse(saved) : { logo: null, name: '' };
                } catch { return { logo: null, name: '' }; }
            });

            // פרטי האומדן
            const [clientName, setClientName] = useState('');
            const [quoteDate, setQuoteDate] = useState(new Date().toISOString().split('T')[0]);

            // בחירות המיישם
            const [selectedModules, setSelectedModules] = useState(['b2b', 'agent']);
            const [extraTxPacks, setExtraTxPacks] = useState(0);
            // התאמת שעות הקמה לאומדן הנוכחי (ברירת המחדל מגיעה מהמחירון)
            const [hoursOverride, setHoursOverride] = useState({});
            const [extraUserPacks, setExtraUserPacks] = useState(0);
            const [customSelections, setCustomSelections] = useState({});

            // UI
            const [isAdminOpen, setIsAdminOpen] = useState(false);
            const [showSummary, setShowSummary] = useState(false);
            const [iconPickerOpen, setIconPickerOpen] = useState(null);
            const [logoError, setLogoError] = useState('');
            const fileInputRef = useRef(null);
            const logoInputRef = useRef(null);

            const [infoModule, setInfoModule] = useState(null);
            const [pwInput, setPwInput] = useState('');
            const [pwError, setPwError] = useState('');
            const [books, setBooks] = useState([]);
            const [versions, setVersions] = useState([]);
            const [genForm, setGenForm] = useState({ id: '', label: '', implementerName: '', password: '' });
            const [genResult, setGenResult] = useState(null);
            const [genError, setGenError] = useState('');
            const [busy, setBusy] = useState('');

            const [newModule, setNewModule] = useState({ name: '', icon: 'package', tier: 'basic', setupHours: 0, note: '' });
            const [newSectionTitle, setNewSectionTitle] = useState('');

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [config, selectedModules, extraTxPacks, extraUserPacks, isAdminOpen, brand, loadState, tab]);

            // אזהרה לפני יציאה עם שינויים שלא נשמרו
            useEffect(() => {
                const h = (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } };
                window.addEventListener('beforeunload', h);
                return () => window.removeEventListener('beforeunload', h);
            }, [dirty]);

            // שמירה אוטומטית של מיתוג המיישם
            useEffect(() => {
                try { localStorage.setItem(BRAND_KEY, JSON.stringify(brand)); }
                catch { setLogoError('לא ניתן לשמור את הלוגו - אין מספיק מקום באחסון הדפדפן.'); }
            }, [brand]);

            // --- לוגיקת חישוב ---
            const totals = useMemo(() => {
                const details = [];
                let modulesMRR = 0;          // תמיכה, שירות ותחזוקה - חודשי
                let setupBonusTx = 0;        // מענק טרנזקציות חד-פעמי מהמודולים
                let setupHours = 0;

                selectedModules.forEach(id => {
                    const m = config.modules.find(x => x.id === id);
                    if (!m) return;
                    const hours = hoursOverride[id] !== undefined
                        ? (Number(hoursOverride[id]) || 0)
                        : (Number(m.setupHours) || 0);
                    modulesMRR += Number(m.price) || 0;
                    setupBonusTx += Number(m.includedTx) || 0;
                    setupHours += hours;
                    details.push({ ...m, hours });
                });

                // טרנזקציות
                const packTx    = Number(config.extraTxPack.tx) || 0;
                const packPrice = Number(config.extraTxPack.price) || 0;
                // המכסה החודשית מורכבת אך ורק מחבילות שנרכשו.
                // מכסת המודולים היא מענק הקמה חד-פעמי ואינה נספרת כאן.
                const monthlyTx   = extraTxPacks * packTx;
                const extraTxCost = extraTxPacks * packPrice;
                const unitPrice   = packTx > 0 ? packPrice / packTx : 0;

                // משתמשים
                const usersIncluded  = Number(config.users.included) || 0;
                const userPackSize   = Number(config.users.packSize) || 0;
                const userPackPrice  = Number(config.users.packPrice) || 0;
                const extraUsersCost = extraUserPacks * userPackPrice;
                const totalUsers     = usersIncluded + extraUserPacks * userPackSize;

                // אזורים מותאמים אישית
                let addonsMRR = 0, addonsSetup = 0;
                const mrrBreakdown = [], setupBreakdown = [], customItems = [];
                config.customSections.forEach(sec => {
                    const pkg = sec.packages.find(p => p.id === customSelections[sec.id]);
                    if (pkg && Number(pkg.price) > 0) {
                        if (pkg.isOneTime) {
                            addonsSetup += Number(pkg.price);
                            setupBreakdown.push({ label: sec.title + ': ' + pkg.name, price: Number(pkg.price) });
                        } else {
                            addonsMRR += Number(pkg.price);
                            mrrBreakdown.push({ label: sec.title + ': ' + pkg.name, price: Number(pkg.price) });
                        }
                        customItems.push({ ...pkg, sectionTitle: sec.title });
                    }
                });

                const platformPrice = Number(config.platformPrice) || 0;
                const rawMRR = platformPrice + modulesMRR + extraTxCost + extraUsersCost + addonsMRR;

                // רצפת חיוב חודשי: אומדן שנופל מתחתיה מחויב בסכום המינימום
                const minMonthly     = Number(config.minMonthlyCharge) || 0;
                const minimumApplied = rawMRR < minMonthly;
                const totalMRR       = minimumApplied ? minMonthly : rawMRR;

                const setupLaborCost = setupHours * (Number(config.setupHourlyRate) || 0);
                const totalSetup     = setupLaborCost + addonsSetup;
                const setupDays      = (Number(config.setupHoursPerDay) || 9) > 0
                    ? setupHours / Number(config.setupHoursPerDay) : 0;

                return {
                    details, modulesMRR, setupBonusTx, setupHours, setupDays,
                    packTx, packPrice, monthlyTx, extraTxCost, unitPrice,
                    moduleCount: details.length,
                    belowMinimum: details.length > 0 && details.length < (Number(config.minModules) || 0),
                    usersIncluded, userPackSize, userPackPrice, extraUsersCost, totalUsers,
                    addonsMRR, addonsSetup, mrrBreakdown, setupBreakdown, customItems,
                    platformPrice, totalMRR, rawMRR, minMonthly, minimumApplied,
                    setupLaborCost, totalSetup
                };
            }, [config, selectedModules, extraTxPacks, extraUserPacks, customSelections, hoursOverride]);

            // --- פעולות משתמש ---
            const handlePrint = () => {
                const need = Number(config.minModules) || 0;
                if (need > 0 && totals.moduleCount < need) {
                    const head = `נבחרו ${totals.moduleCount} מודולים בלבד.\n\n` +
                        `המינימום לחיוב חודשי הוא ${money(totals.minMonthly)} (שווה ערך ל-${need} מודולים).\n`;
                    const body = totals.minimumApplied
                        ? `החיוב החודשי באומדן יעודכן מ-${money(totals.rawMRR)} ל-${money(totals.minMonthly)}.`
                        : `החיוב החודשי באומדן (${money(totals.rawMRR)}) כבר עומד במינימום.`;
                    if (!window.confirm(head + body + '\n\nלהפיק את המסמך?')) return;
                }
                window.print();
            };

            const toggleModule = (id) => {
                setSelectedModules(prev => prev.includes(id) ? prev.filter(m => m !== id) : [...prev, id]);
            };

            function clearUserSelections() {
                if (window.confirm('לנקות את כל הבחירות ולהתחיל אומדן חדש? (המחירון והלוגו שלך יישמרו)')) {
                    setClientName('');
                    setQuoteDate(new Date().toISOString().split('T')[0]);
                    setSelectedModules([]);
                    setHoursOverride({});
                    setExtraTxPacks(0);
                    setExtraUserPacks(0);
                    setCustomSelections({});
                }
            }

            // --- עזרי ניהול ---
            const updateConfigValue = (path, val) => {
                const next = JSON.parse(JSON.stringify(config));
                let cur = next;
                for (let i = 0; i < path.length - 1; i++) cur = cur[path[i]];
                cur[path[path.length - 1]] = val;
                setConfig(next);
            };

            // שינוי רמת מודול - מיישר גם את המחיר ומכסת הטרנזקציות לרמה החדשה
            const setModuleTier = (idx, tier) => {
                const next = JSON.parse(JSON.stringify(config));
                const tierDef = next.moduleTiers[tier];
                next.modules[idx].tier = tier;
                next.modules[idx].price = tierDef.price;
                next.modules[idx].includedTx = tierDef.tx;
                setConfig(next);
            };

            // עדכון הגדרת רמה - מסנכרן את כל המודולים באותה רמה
            const updateTierDef = (tier, field, val) => {
                const next = JSON.parse(JSON.stringify(config));
                next.moduleTiers[tier][field] = val;
                next.modules.forEach(m => {
                    if (m.tier !== tier) return;
                    if (field === 'price') m.price = val;
                    if (field === 'tx') m.includedTx = val;
                });
                setConfig(next);
            };

            const duplicateModule = (moduleId) => {
                const src = config.modules.find(m => m.id === moduleId);
                if (!src) return;
                const copy = JSON.parse(JSON.stringify(src));
                copy.id = 'mod_' + Date.now();
                copy.name = src.name + ' (עותק)';
                setConfig(prev => ({ ...prev, modules: [...prev.modules, copy] }));
            };

            const addNewModule = () => {
                if (!newModule.name) return;
                const tierDef = config.moduleTiers[newModule.tier];
                const id = 'mod_' + Date.now();
                setConfig(prev => ({
                    ...prev,
                    modules: [...prev.modules, {
                        id,
                        name: newModule.name,
                        icon: newModule.icon,
                        tier: newModule.tier,
                        price: tierDef.price,
                        includedTx: tierDef.tx,
                        setupHours: Number(newModule.setupHours) || 0,
                        note: newModule.note || ''
                    }]
                }));
                setNewModule({ name: '', icon: 'package', tier: 'basic', setupHours: 0, note: '' });
            };

            const deleteModule = (idx, id) => {
                const next = [...config.modules];
                next.splice(idx, 1);
                updateConfigValue(['modules'], next);
                setSelectedModules(prev => prev.filter(m => m !== id));
            };

            const addNewSection = () => {
                if (!newSectionTitle) return;
                const id = 'sec_' + Date.now();
                setConfig(prev => ({
                    ...prev,
                    customSections: [...prev.customSections, {
                        id, title: newSectionTitle,
                        packages: [{ id: id + '_0', name: 'לא נבחר', price: 0, isOneTime: false }]
                    }]
                }));
                setNewSectionTitle('');
            };

            const discardChanges = async () => {
                if (!dirty || !book) return;
                if (!window.confirm('לבטל את השינויים שלא נשמרו ולחזור לגרסה השמורה?')) return;
                let fresh = null;
                try { fresh = await storage.get(book.id); } catch {}
                if (fresh) { setBook(fresh); setSavedPrint(pricingFingerprint(fresh.config)); }
            };

            const handleSave = async () => {
                const note = window.prompt('תיאור קצר לשינוי (יופיע בהיסטוריית הגרסאות):', 'עדכון מחירון');
                if (note === null) return;
                try {
                    await saveBook(note || 'עדכון מחירון');
                    await refreshVersions();
                    await refreshBooks();
                    alert('המחירון נשמר.');
                } catch (e) { alert('שמירה נכשלה: ' + (e.message || e)); }
            };

            // סנכרון מחירון המיישם מול המאסטר
            const syncFromMaster = async () => {
                if (!book || !master) return;
                if (!window.confirm('לעדכן את המחירון שלך לפי מחירון המאסטר?\nכל השינויים שביצעת יוחלפו בערכי המאסטר.')) return;
                const next = {
                    ...book,
                    config: JSON.parse(JSON.stringify(master.config)),
                    masterVersion: master.version,
                    version: (Number(book.version) || 0) + 1,
                    updatedAt: nowIso()
                };
                try {
                    await storage.put(next);
                    try {
                        await storage.putVersion(next.id, {
                            id: newId('v'), at: next.updatedAt,
                            note: 'סנכרון ממחירון המאסטר (גרסה ' + (master.version || '-') + ')',
                            version: next.version, config: next.config,
                            label: next.label, implementerName: next.implementerName
                        });
                    } catch {}
                    setBook(next);
                    setSavedPrint(pricingFingerprint(next.config));
                    await refreshVersions();
                    setTab('quote');
                    alert('המחירון סונכרן בהצלחה.');
                } catch (e) { alert('הסנכרון נכשל: ' + (e.message || e)); }
            };

            // גיבוי המחירון הנוכחי לקובץ
            const exportConfig = () => {
                const out = { ...config, publishedAt: new Date().toISOString(),
                              label: book ? book.label : '', implementerName: book ? book.implementerName : '' };
                delete out._basedOn;
                const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(out, null, 2));
                const a = document.createElement('a');
                a.setAttribute('href', dataStr);
                a.setAttribute('download', PRICEBOOK_URL);
                document.body.appendChild(a);
                a.click();
                a.remove();
            };

            const importConfig = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const fr = new FileReader();
                fr.onload = e => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed && parsed.modules) {
                            setConfig(migrateConfig(parsed));
                            alert('המחירון נטען כעקיפה מקומית. כדי שיחול על כולם, יש לפרסם אותו כקובץ pricing.json באתר.');
                        } else {
                            alert('קובץ לא חוקי או פגום.');
                        }
                    } catch { alert('שגיאה בקריאת הקובץ.'); }
                };
                fr.readAsText(file, 'UTF-8');
                event.target.value = null;
            };

            // --- העלאת לוגו המיישם ---
            const uploadImplementerLogo = (event) => {
                const file = event.target.files[0];
                event.target.value = null;
                if (!file) return;
                setLogoError('');
                if (!file.type.startsWith('image/')) {
                    setLogoError('יש לבחור קובץ תמונה (PNG / JPG / SVG).');
                    return;
                }
                resizeImage(file, 600, (dataUrl) => {
                    if (!dataUrl) { setLogoError('לא הצלחנו לקרוא את קובץ התמונה.'); return; }
                    if (dataUrl.length > 2 * 1024 * 1024) {
                        setLogoError('הלוגו כבד מדי לשמירה בדפדפן. נסה קובץ קטן יותר.');
                        return;
                    }
                    setBrand(prev => ({ ...prev, logo: dataUrl }));
                });
            };

            const removeImplementerLogo = () => {
                setLogoError('');
                setBrand(prev => ({ ...prev, logo: null }));
            };

            // --- רכיבי תצוגה ---
            const tierMeta = (tier) => tier === 'premium'
                ? { label: config.moduleTiers.premium.label, chip: 'bg-violet-100 text-violet-700', ring: 'border-violet-500 bg-violet-50', dot: 'text-violet-600' }
                : { label: config.moduleTiers.basic.label,   chip: 'bg-blue-100 text-blue-700',     ring: 'border-blue-600 bg-blue-50',    dot: 'text-blue-600' };

            const ModuleCard = ({ m, isSelected }) => {
                const t = tierMeta(m.tier);
                const hasInfo = !!MODULE_INFO[m.id];
                return (
                    <div role="button" tabIndex={0} onClick={() => toggleModule(m.id)}
                        onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleModule(m.id); } }}
                        className={`relative flex flex-col items-start text-right p-4 rounded-2xl transition-all border-2 h-full cursor-pointer ${isSelected ? t.ring + ' shadow-md' : 'border-slate-200 bg-white hover:border-slate-300'}`}>
                        {isSelected && <div className={`absolute top-3 left-3 ${t.dot}`}><Icon name="check-circle-2" size={18} /></div>}
                        <div className={`mb-3 p-2 rounded-xl ${isSelected ? 'bg-white' : 'bg-slate-50'} ${isSelected ? t.dot : 'text-slate-400'}`}>
                            <Icon name={m.icon} size={22} />
                        </div>
                        <span className={`text-sm font-black leading-tight ${isSelected ? 'text-slate-900' : 'text-slate-700'}`}>{m.name}</span>
                        <span className={`mt-2 text-[10px] font-black px-2 py-0.5 rounded-full ${t.chip}`}>{t.label}</span>
                        {m.note && <span className="mt-2 text-[11px] text-slate-400 leading-snug line-clamp-3">{m.note}</span>}
                        {hasInfo && (
                            <button type="button"
                                onClick={e => { e.stopPropagation(); setInfoModule(m); }}
                                className="mt-3 inline-flex items-center gap-1 text-[11px] font-black text-blue-600 bg-blue-50 hover:bg-blue-100 px-2.5 py-1 rounded-lg transition-colors">
                                <Icon name="file-text" size={12} /> מה המודול כולל
                            </button>
                        )}
                        <div className="mt-auto pt-3 w-full border-t border-dashed border-slate-200 mt-3 space-y-2">
                            <div>
                                <div className="font-black text-slate-900">{money(m.price)}<span className="text-[10px] font-normal text-slate-400"> /חודש</span></div>
                                <div className="text-[10px] text-slate-400 font-bold leading-tight">תמיכה, שירות ותחזוקה</div>
                            </div>
                            <div className="flex items-center gap-1.5 text-[11px] font-black text-orange-600">
                                <Icon name="hammer" size={12} /> {fmt(m.setupHours)} שעות הקמה
                            </div>
                            <div className="text-[10px] font-bold text-emerald-700 bg-emerald-50 rounded-md px-2 py-1 leading-tight">
                                מענק הקמה: {fmt(m.includedTx)} טרנזקציות ללא עלות
                                <span className="block text-[9px] font-normal text-emerald-600">חד-פעמי, לא חודשי</span>
                            </div>
                        </div>
                    </div>
                );
            };

            // כפתור מדרגה (+/-)
            const Stepper = ({ value, onChange, min = 0 }) => (
                <div className="flex items-center gap-2">
                    <button onClick={() => onChange(Math.max(min, value - 1))}
                        className="w-9 h-9 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center">−</button>
                    <input type="number" min={min} value={value}
                        onChange={e => onChange(Math.max(min, Number(e.target.value) || 0))}
                        className="w-16 text-center p-2 border rounded-lg font-black bg-white" />
                    <button onClick={() => onChange(value + 1)}
                        className="w-9 h-9 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-black flex items-center justify-center">+</button>
                </div>
            );

            if (!bootReady || loadState === 'loading' || !book) {
                return (
                    <div dir="rtl" className="min-h-screen bg-slate-50 flex items-center justify-center">
                        <div className="text-center">
                            <div className="text-lg font-black text-slate-700">טוען מחירון…</div>
                            <div className="text-sm text-slate-400 mt-1">ONEFLOW PRO BUSINESS</div>
                        </div>
                    </div>
                );
            }

            if (!authed) {
                return (
                    <div dir="rtl" className="min-h-screen bg-slate-50 flex items-center justify-center p-6">
                        <form onSubmit={submitPassword}
                            className="bg-white rounded-3xl shadow-xl border border-slate-200 p-8 w-full max-w-sm text-center">
                            <BrandLogo src={config.brandLogo} className="h-10 object-contain mx-auto mb-5" />
                            <h1 className="text-xl font-black text-slate-800">{book.label || 'מחירון מוגן'}</h1>
                            <p className="text-sm text-slate-500 mt-1 mb-6">הזן את הסיסמה שקיבלת כדי להיכנס למחירון שלך</p>
                            <input type="password" value={pwInput} autoFocus
                                onChange={e => { setPwInput(e.target.value); setPwError(''); }}
                                className="w-full p-3 border rounded-xl text-center font-bold tracking-widest" placeholder="סיסמה" />
                            {pwError && <p className="text-xs font-bold text-red-600 mt-2">{pwError}</p>}
                            <button type="submit"
                                className="w-full mt-5 py-3 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl">
                                כניסה
                            </button>
                            {!backendCfg.baseUrl && (
                                <p className="text-[11px] text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-2 mt-5 leading-relaxed">
                                    המערכת אינה מחוברת למסד נתונים. ההגנה כאן מונעת כניסה מזדמנת בלבד ואינה אבטחה מלאה.
                                </p>
                            )}
                        </form>
                    </div>
                );
            }

            return (
                <div dir="rtl" className="min-h-screen bg-slate-50">

                    {/* Header */}
                    <header className="no-print sticky top-0 z-50 bg-white border-b shadow-sm h-16 flex items-center justify-between px-4 md:px-6 gap-3">
                        <div className="flex items-center gap-4 min-w-0">
                            <BrandLogo src={config.brandLogo} className="h-8 object-contain flex-shrink-0" />
                            {brand.logo && (
                                <>
                                    <div className="w-px h-8 bg-slate-200 hidden md:block"></div>
                                    <img src={brand.logo} alt="לוגו המיישם" className="h-8 object-contain hidden md:block" />
                                </>
                            )}
                            <span className="text-sm font-medium text-slate-400 border-r-2 border-slate-200 pr-4 hidden xl:block">מחשבון אומדן פרויקטים למיישם</span>
                            <span title={pricebookState.title}
                                className={`hidden md:inline-flex items-center gap-1 text-[11px] font-black px-2.5 py-1 rounded-full whitespace-nowrap ${pricebookState.chipClass}`}>
                                <Icon name={pricebookState.icon} size={12} />
                                {pricebookState.chipText}
                            </span>
                        </div>
                        <div className="flex items-center gap-2 md:gap-3">
                            <input type="text" placeholder="שם המיישם" value={brand.name}
                                onChange={e => setBrand({ ...brand, name: e.target.value })}
                                className="hidden lg:block p-2 border border-blue-200 rounded-lg text-sm w-32 bg-blue-50 placeholder-blue-400 font-bold" />
                            <input type="text" placeholder="שם פרויקט / לקוח" value={clientName}
                                onChange={e => setClientName(e.target.value)}
                                className="hidden md:block p-2 border rounded-lg text-sm w-40 bg-slate-50" />
                            <input type="date" value={quoteDate} onChange={e => setQuoteDate(e.target.value)}
                                className="hidden md:block p-2 border rounded-lg text-sm bg-slate-50" />
                            <button onClick={clearUserSelections}
                                className="flex items-center gap-1 p-2 text-sm font-bold text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                                <Icon name="rotate-ccw" size={16} /> <span className="hidden md:inline">נקה</span>
                            </button>
                            <button onClick={() => setIsAdminOpen(true)}
                                className="p-2 bg-slate-100 rounded-full hover:bg-slate-200 text-slate-600"><Icon name="settings" /></button>
                        </div>
                    </header>

                    {/* Tabs */}
                    {!isMasterBook && (
                        <div className="no-print max-w-[90rem] mx-auto px-4 md:px-8 pt-5">
                            <div className="flex gap-2 border-b border-slate-200">
                                <button onClick={() => setTab('quote')}
                                    className={`px-5 py-3 font-black text-sm rounded-t-xl border-b-2 -mb-px transition-colors ${tab === 'quote' ? 'border-blue-600 text-blue-700 bg-white' : 'border-transparent text-slate-400 hover:text-slate-600'}`}>
                                    בניית אומדן
                                </button>
                                <button onClick={() => setTab('master')}
                                    className={`px-5 py-3 font-black text-sm rounded-t-xl border-b-2 -mb-px transition-colors flex items-center gap-2 ${tab === 'master' ? 'border-blue-600 text-blue-700 bg-white' : 'border-transparent text-slate-400 hover:text-slate-600'}`}>
                                    מחירון המאסטר
                                    {masterBehind && <span className="bg-amber-500 text-white text-[10px] font-black px-2 py-0.5 rounded-full">{masterDiff.total}</span>}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Master sync tab */}
                    {!isMasterBook && tab === 'master' && (
                        <main className="no-print max-w-[90rem] mx-auto p-4 md:p-8 space-y-6">
                            <section className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                <div className="flex flex-wrap justify-between items-start gap-4">
                                    <div>
                                        <h2 className="text-2xl font-black text-slate-800">מחירון המאסטר</h2>
                                        <p className="text-sm text-slate-500 mt-1">
                                            {master ? ((master.label || 'מחירון מאסטר') + ' · גרסה ' + (master.version || '-') +
                                                ' · עודכן ' + new Date(master.updatedAt || Date.now()).toLocaleString('he-IL')) : 'טוען…'}
                                        </p>
                                    </div>

                    <div id="print-area">
                        <div className="print-container">

                            {/* כותרת ולוגואים */}
                            <div className="avoid-break" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', borderBottom: '3px solid #2563eb', paddingBottom: '20px', marginBottom: '30px' }}>
                                <div>
                                    <BrandLogo src={config.brandLogo} style={{ height: '45px', marginBottom: '15px', objectFit: 'contain' }} />
                                    <div className="print-sub-header">
                                        <p><strong>לקוח / פרויקט:</strong> {clientName || 'לא צוין'}</p>
                                        <p><strong>מיישם עורך האומדן:</strong> {brand.name || 'לא צוין'}</p>
                                        <p><strong>תאריך הפקה:</strong> {new Date(quoteDate).toLocaleDateString('he-IL')}</p>
                                    </div>
                                </div>
                                <div style={{ textAlign: 'left' }}>
                                    {brand.logo
                                        ? <img src={brand.logo} alt="לוגו המיישם" style={{ height: '45px', marginBottom: '5px', objectFit: 'contain' }} />
                                        : <img src="oneflowlogo.png" alt="ONEFLOW 360 PRO" style={{ height: '40px', marginBottom: '5px', objectFit: 'contain' }} />}
                                    <p style={{ fontSize: '10pt', letterSpacing: '1px', textTransform: 'uppercase', color: '#64748b' }}>Digital Backbone Solutions</p>
                                </div>
                            </div>

                            <div className="avoid-break">
                                <h2>1. מודולים נבחרים ותכולת הפרויקט</h2>
                                <table>
                                    <thead>
                                        <tr>
                                            <th style={{ width: '30%' }}>מודול</th>
                                            <th style={{ width: '11%', textAlign: 'center' }}>רמה</th>
                                            <th style={{ width: '12%', textAlign: 'center' }}>שעות הקמה</th>
                                            <th style={{ width: '20%', textAlign: 'center' }}>מענק טרנזקציות (חד-פעמי)</th>
                                            <th style={{ textAlign: 'center' }}>תמיכה ותחזוקה (₪/חודש)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {totals.details.map(m => (
                                            <tr key={m.id}>
                                                <td>
                                                    <div style={{ fontWeight: 'bold', fontSize: '11pt', color: '#1e293b' }}>{m.name}</div>
                                                    {m.note && <div style={{ fontSize: '9pt', color: '#64748b', marginTop: '4px' }}>{m.note}</div>}
                                                </td>
                                                <td style={{ textAlign: 'center' }}>
                                                    <span className={'badge ' + (m.tier === 'premium' ? 'badge-premium' : 'badge-basic')}>
                                                        {m.tier === 'premium' ? config.moduleTiers.premium.label : config.moduleTiers.basic.label}
                                                    </span>
                                                </td>
                                                <td style={{ textAlign: 'center', fontWeight: 'bold', color: '#ea580c' }}>{fmt(m.hours)}</td>
                                                <td style={{ textAlign: 'center', fontWeight: 'bold', color: '#047857' }}>{fmt(m.includedTx)}</td>
                                                <td style={{ textAlign: 'center', fontWeight: 'bold', fontSize: '11pt' }}>{money(m.price)}</td>
                                            </tr>
                                        ))}
                                        <tr style={{ backgroundColor: '#f1f5f9', borderTop: '2px solid #cbd5e1' }}>
                                            <td colSpan="2" style={{ fontWeight: 'bold', fontSize: '11pt' }}>סה"כ {totals.moduleCount} מודולים:</td>
                                            <td style={{ textAlign: 'center', fontWeight: 'bold', color: '#c2410c' }}>{fmt(totals.setupHours)}</td>
                                            <td style={{ textAlign: 'center', fontWeight: 'bold', color: '#047857' }}>{fmt(totals.setupBonusTx)}</td>
                                            <td style={{ textAlign: 'center', fontWeight: 'bold', color: '#1e3a8a', fontSize: '12pt' }}>{money(totals.modulesMRR)}</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <p style={{ fontSize: '9pt', color: '#64748b', marginTop: '8px' }}>
                                    העלות החודשית שלצד כל מודול היא דמי תמיכה, שירות ותחזוקה. מכסת הטרנזקציות שלצדו היא
                                    מענק הקמה חד-פעמי ללא עלות, ואינה מכסה חודשית מתחדשת.
                                    {totals.minMonthly > 0 && ' מינימום החיוב החודשי הוא ' + money(totals.minMonthly) + ', שווה ערך ל-' + config.minModules + ' מודולים.'}
                                </p>
                            </div>

                            <div className="avoid-break">
                                <h2>2. חבילת הבסיס, טרנזקציות ומשתמשים</h2>
                                <table>
                                    <thead>
                                        <tr>
                                            <th>רכיב</th>
                                            <th>פירוט היקף</th>
                                            <th style={{ textAlign: 'center', width: '110px' }}>סוג חיוב</th>
                                            <th style={{ textAlign: 'center', width: '110px' }}>עלות (₪)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td style={{ fontWeight: 'bold' }}>{config.platformName}</td>
                                            <td>{config.platformDescription}</td>
                                            <td style={{ textAlign: 'center' }}><span className="badge">חודשי</span></td>
                                            <td style={{ textAlign: 'center', fontWeight: 'bold' }}>{money(totals.platformPrice)}</td>
                                        </tr>
                                        <tr>
                                            <td style={{ fontWeight: 'bold' }}>חבילת טרנזקציות חודשית</td>
                                            <td>
                                                {extraTxPacks} חבילות × {fmt(totals.packTx)} = {fmt(totals.monthlyTx)} טרנזקציות לחודש
                                                <div style={{ fontSize: '9pt', color: '#047857', marginTop: '4px' }}>
                                                    בנוסף: מענק הקמה חד-פעמי של {fmt(totals.setupBonusTx)} טרנזקציות ללא עלות
                                                </div>
                                            </td>
                                            <td style={{ textAlign: 'center' }}><span className="badge">חודשי</span></td>
                                            <td style={{ textAlign: 'center', fontWeight: 'bold' }}>{money(totals.extraTxCost)}</td>
                                        </tr>
                                        <tr>
                                            <td style={{ fontWeight: 'bold' }}>משתמשי מערכת</td>
                                            <td>
                                                {fmt(totals.usersIncluded)} כלולים
                                                {extraUserPacks > 0 && ' + ' + extraUserPacks + ' חבילות × ' + fmt(totals.userPackSize)}
                                                <div style={{ fontSize: '9pt', color: '#64748b', marginTop: '4px' }}>
                                                    סה"כ {fmt(totals.totalUsers)} משתמשים
                                                </div>
                                            </td>
                                            <td style={{ textAlign: 'center' }}><span className="badge">חודשי</span></td>
                                            <td style={{ textAlign: 'center', fontWeight: 'bold' }}>{money(totals.extraUsersCost)}</td>
                                        </tr>
                                        {totals.customItems.map((item, idx) => (
                                            <tr key={idx}>
                                                <td style={{ fontWeight: 'bold' }}>{item.sectionTitle}: {item.name}</td>
                                                <td>{item.description || 'ללא פירוט נוסף'}</td>
                                                <td style={{ textAlign: 'center' }}>
                                                    <span className="badge" style={{ backgroundColor: item.isOneTime ? '#fff7ed' : '#eff6ff', color: item.isOneTime ? '#c2410c' : '#1e40af' }}>
                                                        {item.isOneTime ? 'חד-פעמי' : 'חודשי'}
                                                    </span>
                                                </td>
                                                <td style={{ textAlign: 'center', fontWeight: 'bold' }}>{money(item.price)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                            <div className="summary-box avoid-break">
                                <h3 style={{ marginTop: 0, borderBottom: 'none', fontSize: '18pt', color: '#1e3a8a' }}>סיכום אומדן כולל לפרויקט</h3>

                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: '20px' }}>
                                    <div>
                                        <div style={{ fontSize: '14pt', fontWeight: 'bold' }}>סה"כ חיוב חודשי קבוע (MRR):</div>
                                        <div style={{ fontSize: '10pt', color: '#64748b', marginTop: '5px' }}>
                                            {fmt(totals.monthlyTx)} טרנזקציות לחודש · {fmt(totals.totalUsers)} משתמשים · {totals.moduleCount} מודולים
                                        </div>
                                        {totals.minimumApplied && (
                                            <div style={{ fontSize: '10pt', color: '#b45309', marginTop: '5px', fontWeight: 'bold' }}>
                                                הועלה למינימום החיוב החודשי של {money(totals.minMonthly)}
                                            </div>
                                        )}
                                    </div>
                                    <div style={{ textAlign: 'left' }}>
                                        {totals.minimumApplied && (
                                            <div style={{ fontSize: '11pt', color: '#b45309', textDecoration: 'line-through' }}>{money(totals.rawMRR)}</div>
                                        )}
                                        <div style={{ fontSize: '24pt', fontWeight: '900', color: '#1e3a8a', lineHeight: 1 }}>{money(totals.totalMRR)}</div>
                                        <div style={{ fontSize: '11pt', color: '#64748b', marginTop: '5px' }}>{usd(totals.totalMRR, config.exchangeRate)}</div>
                                    </div>
                                </div>

                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', paddingTop: '20px', borderTop: '2px dashed #cbd5e1' }}>
                                    <div>
                                        <div style={{ fontSize: '14pt', fontWeight: 'bold', color: '#c2410c' }}>סה"כ עלות הקמה חד-פעמית (Setup):</div>
                                        <div style={{ fontSize: '11pt', color: '#ea580c', marginTop: '5px' }}>
                                            {fmt(totals.setupHours)} שעות × {money(config.setupHourlyRate)} לשעה (≈ {totals.setupDays.toFixed(1)} ימי עבודה)
                                        </div>
                                        {totals.setupBonusTx > 0 && (
                                            <div style={{ fontSize: '11pt', color: '#047857', marginTop: '5px', fontWeight: 'bold' }}>
                                                כולל מענק הקמה: {fmt(totals.setupBonusTx)} טרנזקציות ללא עלות
                                            </div>
                                        )}
                                    </div>
                                    <div style={{ textAlign: 'left' }}>
                                        <div style={{ fontSize: '24pt', fontWeight: '900', color: '#c2410c', lineHeight: 1 }}>{money(totals.totalSetup)}</div>
                                        <div style={{ fontSize: '11pt', color: '#9a3412', marginTop: '5px' }}>{usd(totals.totalSetup, config.exchangeRate)}</div>
                                    </div>
                                </div>
                            </div>

                            <div className="avoid-break" style={{ marginTop: '50px', textAlign: 'center', fontSize: '10pt', color: '#64748b', borderTop: '1px solid #e2e8f0', paddingTop: '20px' }}>
                                <p style={{ fontWeight: 'bold', color: '#ef4444', fontSize: '12pt' }}>
                                    מסמך אומדן זה מיועד לשימוש פנימי בלבד לשם הערכת עלויות טרם הפקת הצעת מחיר רשמית.
                                </p>
                                <p style={{ marginTop: '8px' }}>המחירים אינם כוללים מע"מ | שער המרה פנימי: {config.exchangeRate} ₪ ל-$1</p>
                                <p style={{ fontWeight: 'bold', marginTop: '10px', color: '#1e293b' }}>
                                    {config.platformName} — Internal Pricing Tool
                                </p>
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
