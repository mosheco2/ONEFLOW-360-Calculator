# מגדיר את שרת ה-API ומסד הנתונים לפריסה ברנדר בלחיצה אחת.
# האתר הסטטי אינו כלול כאן - הוא כבר מוגדר בחשבון בנפרד.
databases:
  - name: oneflow-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: oneflow-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oneflow-db
          property: connectionString
      - key: ORG_SLUG
        value: onebtn_team
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGIN
        sync: false
